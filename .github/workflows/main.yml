# ========================================
# Main GKI kernel build entry point
# ========================================
# This workflow is the project's unified entry point for:
# 1. Build all GKI kernel versions
# 2. Collect rejected patch files for debugging
# 3. Create a GitHub Release (optional)
# ========================================

name: Build Kernel

# Use Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Concurrency control: only one run per branch; new runs cancel previous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== Release configuration ====================
      release_type:
        description: "Release type"
        type: choice
        options:
          - Actions
          - Pre-Release
          - Release
        default: Actions

      # ==================== KernelSU configuration ====================
      # KernelSU variant is fixed to BakaSU
      kernelsu_branch:
        description: "BakaSU branch (main/dev/custom; blank uses main)"
        type: string
        default: "main"
        required: false

      # ==================== Optional configuration ====================
      version:
        description: "Custom version name (optional)"
        type: string
        default: ""
        required: false
      build_time:
        description: "Custom build time (optional; N or blank means current UTC)"
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
        required: false
      droidspaces:
        description: "Droidspaces container support (5.10–6.6: slot patches; 6.12+: enable/disable)"
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      droidspaces_ntsync:
        description: "Enable NTSync for Droidspaces containers (requires Droidspaces)"
        type: boolean
        default: false
      build_bypass:
        description: "Build both standard and Bypass kernels"
        type: boolean
        default: false

      # ==================== Feature toggles ====================
      clean_build:
        description: "Clean build (no KernelSU, SUSFS or optional patches)"
        type: boolean
        default: false

      use_zram:
        description: "Enable enhanced ZRAM compression"
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG anti-bricking protection"
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel driver"
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply CVE-2026-43499 rtmutex fix series"
        type: boolean
        default: true
      cancel_susfs:
        description: "Disable SUSFS"
        type: boolean
        default: false

      # ==================== Build target selection ====================
      build_target:
        description: "Select a single KMI build target, or build all"
        type: choice
        options:
          - all
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
        default: all
      build_kernel_version:
        description: "Build by kernel version and selected KMI (takes precedence over the target selection above)"
        type: boolean
        default: false
      kernel_version_filter:
        description: "Kernel version, e.g. 6.6.66 or 6.6.X (case-insensitive X builds every subversion in that kernel series)"
        type: string
        default: ""
        required: false
      kernel_android_version:
        description: "Select Android KMI for 5.10/5.15; leave auto for 6.1+"
        type: choice
        options:
          - auto
          - android12
          - android13
          - android14
        default: auto

      # ==================== Bot-push options ====================
      change_log:
        description: "Change log (optional, multiline)"
        type: string
        default: ""
        required: false

jobs:
  resolve-ksu-ref:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Pin BakaSU build commit
        id: resolve
        if: inputs.clean_build != true
        env:
          KSU_BRANCH: ${{ inputs.kernelsu_branch || 'main' }}
        run: |
          set -euo pipefail
          if [[ "$KSU_BRANCH" =~ ^[a-fA-F0-9]{40}$ ]]; then
            sha="${KSU_BRANCH,,}"
          else
            git check-ref-format --branch "$KSU_BRANCH"
            sha=$(git ls-remote --heads https://github.com/Baka-SU/BakaSU.git "refs/heads/$KSU_BRANCH" | awk '{ print $1 }')
          fi
          if [[ ! "$sha" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::BakaSU branch or commit not found: $KSU_BRANCH"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  select-kernel-version:
    if: inputs.build_kernel_version
    runs-on: ubuntu-latest
    outputs:
      data_file: ${{ steps.select.outputs.data_file }}
      deduplicate_sublevels: ${{ steps.select.outputs.deduplicate_sublevels }}
    steps:
      - name: Locate kernel version data
        id: select
        env:
          KERNEL_FILTER: ${{ inputs.kernel_version_filter }}
          ANDROID_CHOICE: ${{ inputs.kernel_android_version }}
        run: |
          if [[ ! "$KERNEL_FILTER" =~ ^([0-9]+\.[0-9]+)\.([0-9]+|[xX])$ ]]; then
            echo "::error::Kernel version format must be 6.6.66 or 6.6.X"
            exit 1
          fi
          kernel_series="${BASH_REMATCH[1]}"
          case "$kernel_series" in
            5.10)
              if [[ "$ANDROID_CHOICE" != android12 && "$ANDROID_CHOICE" != android13 ]]; then
                echo "::error::5.10 has Android 12 and Android 13 KMIs; explicitly select android12 or android13"
                exit 1
              fi
              deduplicate=false ;;
            5.15)
              if [[ "$ANDROID_CHOICE" != android13 && "$ANDROID_CHOICE" != android14 ]]; then
                echo "::error::5.15 has Android 13 and Android 14 KMIs; explicitly select android13 or android14"
                exit 1
              fi
              deduplicate=true ;;
            6.1) android_version=android14; deduplicate=true ;;
            6.6) android_version=android15; deduplicate=true ;;
            6.12) android_version=android16; deduplicate=true ;;
            6.18) android_version=android17; deduplicate=true ;;
            *) echo "::error::Unsupported kernel series: ${BASH_REMATCH[1]}"; exit 1 ;;
          esac
          if [[ "$kernel_series" == 5.10 || "$kernel_series" == 5.15 ]]; then
            data_file="data/$ANDROID_CHOICE/$kernel_series.json"
          else
            data_file="data/$android_version/$kernel_series.json"
          fi
          echo "data_file=$data_file" >> "$GITHUB_OUTPUT"
          echo "deduplicate_sublevels=$deduplicate" >> "$GITHUB_OUTPUT"

  prepare-selected-matrix:
    needs: select-kernel-version
    uses: ./.github/workflows/prepare-matrix.yml
    with:
      data_file: ${{ needs.select-kernel-version.outputs.data_file }}
      deduplicate_sublevels: ${{ needs.select-kernel-version.outputs.deduplicate_sublevels == 'true' }}
      kernel_filter: ${{ inputs.kernel_version_filter }}

  build-selected-kernels:
    needs: [prepare-selected-matrix, resolve-ksu-ref]
    name: "${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.android_version }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-selected-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      clean_build: ${{ inputs.clean_build }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      revision: ${{ matrix.revision || '' }}
      ksu_variant: ${{ inputs.clean_build && 'Clean' || 'BakaSU' }}
      ksu_branch: ${{ needs.resolve-ksu-ref.outputs.sha || 'main' }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: false
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      build_bypass: ${{ inputs.build_bypass || false }}

  # ==================== Android 12 - 5.10 builds ====================
  build-a12-5-10:
    if: ${{ !inputs.build_kernel_version && (inputs.build_target == 'android12-5.10' || inputs.build_target == 'all') }}
    needs: resolve-ksu-ref
    uses: ./.github/workflows/kernel-a12-5-10.yml
    secrets: inherit
    with:
      clean_build: ${{ inputs.clean_build }}
      kernelsu_branch: ${{ needs.resolve-ksu-ref.outputs.sha || 'main' }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      build_bypass: ${{ inputs.build_bypass }}

  # ==================== Android 13 - 5.10 builds ====================
  build-a13-5-10:
    if: ${{ !inputs.build_kernel_version && (inputs.build_target == 'android13-5.10' || inputs.build_target == 'all') }}
    needs: resolve-ksu-ref
    uses: ./.github/workflows/kernel-a13-5-10.yml
    secrets: inherit
    with:
      clean_build: ${{ inputs.clean_build }}
      kernelsu_branch: ${{ needs.resolve-ksu-ref.outputs.sha || 'main' }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      build_bypass: ${{ inputs.build_bypass }}

  # ==================== Android 13 - 5.15 builds ====================
  build-a13-5-15:
    if: ${{ !inputs.build_kernel_version && (inputs.build_target == 'android13-5.15' || inputs.build_target == 'all') }}
    needs: resolve-ksu-ref
    uses: ./.github/workflows/kernel-a13-5-15.yml
    secrets: inherit
    with:
      clean_build: ${{ inputs.clean_build }}
      kernelsu_branch: ${{ needs.resolve-ksu-ref.outputs.sha || 'main' }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      build_bypass: ${{ inputs.build_bypass }}

  # ==================== Android 14 - 5.15 builds ====================
  build-a14-5-15:
    if: ${{ !inputs.build_kernel_version && (inputs.build_target == 'android14-5.15' || inputs.build_target == 'all') }}
    needs: resolve-ksu-ref
    uses: ./.github/workflows/kernel-a13-5-15.yml
    secrets: inherit
    with:
      android_version: android14
      clean_build: ${{ inputs.clean_build }}
      kernelsu_branch: ${{ needs.resolve-ksu-ref.outputs.sha || 'main' }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      build_bypass: ${{ inputs.build_bypass }}

  # ==================== Android 14 - 6.1 builds ====================
  build-a14-6-1:
    if: ${{ !inputs.build_kernel_version && (inputs.build_target == 'android14-6.1' || inputs.build_target == 'all') }}
    needs: resolve-ksu-ref
    uses: ./.github/workflows/kernel-a14-6-1.yml
    secrets: inherit
    with:
      clean_build: ${{ inputs.clean_build }}
      kernelsu_branch: ${{ needs.resolve-ksu-ref.outputs.sha || 'main' }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      build_bypass: ${{ inputs.build_bypass }}

  # ==================== Android 15 - 6.6 builds ====================
  build-a15-6-6:
    if: ${{ !inputs.build_kernel_version && (inputs.build_target == 'android15-6.6' || inputs.build_target == 'all') }}
    needs: resolve-ksu-ref
    uses: ./.github/workflows/kernel-a15-6-6.yml
    secrets: inherit
    with:
      clean_build: ${{ inputs.clean_build }}
      kernelsu_branch: ${{ needs.resolve-ksu-ref.outputs.sha || 'main' }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      build_bypass: ${{ inputs.build_bypass }}

  # ==================== Android 16 - 6.12 builds ====================
  build-a16-6-12:
    if: ${{ !inputs.build_kernel_version && (inputs.build_target == 'android16-6.12' || inputs.build_target == 'all') }}
    needs: resolve-ksu-ref
    uses: ./.github/workflows/kernel-a16-6-12.yml
    secrets: inherit
    with:
      clean_build: ${{ inputs.clean_build }}
      kernelsu_branch: ${{ needs.resolve-ksu-ref.outputs.sha || 'main' }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      build_bypass: ${{ inputs.build_bypass }}

  # ==================== Android 17 - 6.18 builds ====================
  build-a17-6-18:
    if: ${{ !inputs.build_kernel_version && (inputs.build_target == 'android17-6.18' || inputs.build_target == 'all') }}
    needs: resolve-ksu-ref
    uses: ./.github/workflows/kernel-a17-6-18.yml
    secrets: inherit
    with:
      clean_build: ${{ inputs.clean_build }}
      kernelsu_branch: ${{ needs.resolve-ksu-ref.outputs.sha || 'main' }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      build_bypass: ${{ inputs.build_bypass }}

  # ==================== Collect rejected patch files ====================
  # Collect .rej files from all build jobs to debug patch failures
  collect-rejects:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - build-selected-kernels
      - build-a12-5-10
      - build-a13-5-10
      - build-a13-5-15
      - build-a14-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
      - build-a17-6-18
    steps:
      - name: Download rejected patch files
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          pattern: '*-Rejects'

      - name: Process rejected patch files
        run: |
          mkdir -p aio-rejects
          for dir in ./downloaded-artifacts/*-Rejects; do
            [ -d "$dir" ] || continue
            dirname=$(basename "$dir")
            original_name=${dirname%-Rejects}
            mkdir -p "aio-rejects/$original_name"
            cp -r "$dir/." "aio-rejects/$original_name/"
          done
          if [ "$(ls -A aio-rejects 2>/dev/null)" ]; then
            cd aio-rejects && zip -r -q -9 ../AIO-REJ.zip . && cd ..
          fi

      - name: Upload collected rejected patch files
        uses: actions/upload-artifact@v6
        with:
          name: AIO-REJ
          path: AIO-REJ.zip
          if-no-files-found: ignore

  # ==================== Create release ====================
  # Create GitHub Release when release_type is not Actions
  # Run on upstream repository only; skip in forks
  release:
    if: ${{ always() && !cancelled() && needs.resolve-ksu-ref.result == 'success' && !inputs.build_kernel_version && inputs.release_type != 'Actions' && github.repository == 'zhuzhuzihan/GKI_BakaSU_SUSFS' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    needs:
      - resolve-ksu-ref
      - build-a12-5-10
      - build-a13-5-10
      - build-a13-5-15
      - build-a14-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
      - build-a17-6-18

    # ==================== Environment variables ====================
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NOTIFY_SUSFS_STATUS: ${{ inputs.clean_build != true && inputs.cancel_susfs != true && inputs.build_target == 'android17-6.18' && 'auto-skipped (Android 17/6.18)' || inputs.clean_build != true && inputs.cancel_susfs != true && inputs.build_target == 'all' && 'enabled (Android 17/6.18 auto-skipped)' || inputs.clean_build != true && inputs.cancel_susfs != true && 'true' || 'false' }}
      NOTIFY_ZRAM_STATUS: ${{ inputs.clean_build != true && inputs.use_zram && inputs.build_target == 'android17-6.18' && 'auto-skipped (Android 17/6.18)' || inputs.clean_build != true && inputs.use_zram && inputs.build_target == 'all' && 'enabled (Android 17/6.18 auto-skipped)' || inputs.clean_build != true && inputs.use_zram && 'true' || 'false' }}
      NOTIFY_REKERNEL_STATUS: ${{ inputs.clean_build != true && inputs.use_rekernel && inputs.build_target == 'android17-6.18' && 'auto-skipped (Android 17/6.18)' || inputs.clean_build != true && inputs.use_rekernel && inputs.build_target == 'all' && 'enabled (Android 17/6.18 auto-skipped)' || inputs.clean_build != true && inputs.use_rekernel && 'true' || 'false' }}

    steps:
      # ==================== Set display names ====================
      # Precompute display names to simplify later references
      - name: Set display names
        run: |
          if [ "${{ inputs.clean_build }}" = "true" ]; then
            KSU_NAME="Clean"
            RELEASE_NAME="GKI Kernel: Clean"
            echo "LZ4_STATUS=Disabled" >> "$GITHUB_ENV"
            echo "BBG_STATUS=Not supported" >> "$GITHUB_ENV"
            echo "LZ4_SUFFIX=" >> "$GITHUB_ENV"
            echo "HOOK_TYPE=" >> "$GITHUB_ENV"
            echo "MOUNT_TYPE=" >> "$GITHUB_ENV"
            echo "BRANCH_INFO=" >> "$GITHUB_ENV"
          else
            KSU_NAME="BakaSU"
            echo "BBG_STATUS=${{ inputs.use_bbg && 'Supported' || 'Not supported' }}" >> "$GITHUB_ENV"
            LZ4_STATUS="${{ inputs.use_zram && 'Enabled' || 'Disabled' }}"
            LZ4_SUFFIX="${{ inputs.use_zram && '、LZ4KD' || '' }}"
            if [ "${{ inputs.use_zram }}" = "true" ]; then
              if [ "${{ inputs.build_target }}" = "android17-6.18" ]; then
                LZ4_STATUS="Android17/6.18 Automatically skipped"
                LZ4_SUFFIX=""
              elif [ "${{ inputs.build_target }}" = "all" ]; then
                LZ4_STATUS="Enabled（Android17/6.18 Automatically skipped）"
              fi
            fi
            echo "LZ4_STATUS=$LZ4_STATUS" >> "$GITHUB_ENV"
            echo "LZ4_SUFFIX=$LZ4_SUFFIX" >> "$GITHUB_ENV"

            if [ "${{ inputs.cancel_susfs }}" = "true" ]; then
              RELEASE_NAME="GKI Kernel: ${KSU_NAME}"
              echo "SUSFS_SUFFIX=" >> "$GITHUB_ENV"
              echo "SUSFS_STATUS=Not included" >> "$GITHUB_ENV"
              echo "HOOK_TYPE=" >> "$GITHUB_ENV"
              echo "MOUNT_TYPE=" >> "$GITHUB_ENV"
            elif [ "${{ inputs.build_target }}" = "android17-6.18" ]; then
              RELEASE_NAME="GKI Kernel: ${KSU_NAME}"
              echo "SUSFS_SUFFIX=" >> "$GITHUB_ENV"
              echo "SUSFS_STATUS=Android17/6.18 Automatically skipped（upstream branch unavailable）" >> "$GITHUB_ENV"
              echo "HOOK_TYPE=" >> "$GITHUB_ENV"
              echo "MOUNT_TYPE=" >> "$GITHUB_ENV"
            else
              RELEASE_NAME="GKI Kernel: ${KSU_NAME} & SUSFS"
              echo "SUSFS_SUFFIX= + **SUSFS**" >> "$GITHUB_ENV"
              if [ "${{ inputs.build_target }}" = "all" ]; then
                echo "SUSFS_STATUS=Included（Android17/6.18 Automatically skipped）" >> "$GITHUB_ENV"
              else
                echo "SUSFS_STATUS=Included / Included" >> "$GITHUB_ENV"
              fi
              echo "HOOK_TYPE=-> SUSFS Inline Hooks" >> "$GITHUB_ENV"
              echo "MOUNT_TYPE=-> Magic Mount Supported" >> "$GITHUB_ENV"
            fi

            if [ "${{ inputs.build_target }}" = "all" ] || [ "${{ inputs.build_target }}" = "android17-6.18" ]; then
              echo "COMPATIBILITY_NOTE=Android 17 / 6.18 Automatically skipped SUSFS、ZRAM/LZ4KD、NTSync、Re-Kernel、OnePlus 8E-specific patchand CVE-2026-43499 fix series。" >> "$GITHUB_ENV"
            fi

            echo "BRANCH_INFO=(${{ inputs.kernelsu_branch || 'main' }})" >> "$GITHUB_ENV"
          fi

          echo "KSU_NAME=$KSU_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"

      - name: Verify build status
        run: |
          failed=0
          check_build() {
            local selected="$1" job_name="$2" result="$3"
            if [[ "$selected" == "true" && "$result" != "success" ]]; then
              echo "Selected build job $job_name failed (result: $result)"
              failed=1
            fi
          }
          check_build "${{ inputs.build_target == 'android12-5.10' || inputs.build_target == 'all' }}" "build-a12-5-10" "${{ needs.build-a12-5-10.result }}"
          check_build "${{ inputs.build_target == 'android13-5.10' || inputs.build_target == 'all' }}" "build-a13-5-10" "${{ needs.build-a13-5-10.result }}"
          check_build "${{ inputs.build_target == 'android13-5.15' || inputs.build_target == 'all' }}" "build-a13-5-15" "${{ needs.build-a13-5-15.result }}"
          check_build "${{ inputs.build_target == 'android14-5.15' || inputs.build_target == 'all' }}" "build-a14-5-15" "${{ needs.build-a14-5-15.result }}"
          check_build "${{ inputs.build_target == 'android14-6.1' || inputs.build_target == 'all' }}" "build-a14-6-1" "${{ needs.build-a14-6-1.result }}"
          check_build "${{ inputs.build_target == 'android15-6.6' || inputs.build_target == 'all' }}" "build-a15-6-6" "${{ needs.build-a15-6-6.result }}"
          check_build "${{ inputs.build_target == 'android16-6.12' || inputs.build_target == 'all' }}" "build-a16-6-12" "${{ needs.build-a16-6-12.result }}"
          check_build "${{ inputs.build_target == 'android17-6.18' || inputs.build_target == 'all' }}" "build-a17-6-18" "${{ needs.build-a17-6-18.result }}"
          [[ "$failed" -ne 0 ]] && exit 1 || true

      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Get KernelSU commit information
        if: inputs.clean_build != true
        run: |
          KSU_REF="${{ needs.resolve-ksu-ref.outputs.sha }}"
          KSU_URL="https://github.com/Baka-SU/BakaSU/commit/$KSU_REF"

          echo "KSU_REF=$KSU_REF" >> "$GITHUB_ENV"
          echo "KSU_URL=$KSU_URL" >> "$GITHUB_ENV"

      - name: Get SUSFS commit information
        if: inputs.clean_build != true
        run: |
          GITLAB_OWNER="simonpunk"
          GITLAB_REPO="susfs4ksu"
          declare -A BRANCH_MAP=(
            ["gki_android12_5_10"]="gki-android12-5.10"
            ["gki_android13_5_10"]="gki-android13-5.10"
            ["gki_android13_5_15"]="gki-android13-5.15"
            ["gki_android14_5_15"]="gki-android14-5.15"
            ["gki_android14_6_1"]="gki-android14-6.1"
            ["gki_android15_6_6"]="gki-android15-6.6"
            ["gki_android16_6_12"]="gki-android16-6.12"
          )
          for var_name in "${!BRANCH_MAP[@]}"; do
            branch_name="${BRANCH_MAP[$var_name]}"
            COMMIT_HASH=$(git ls-remote https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO.git refs/heads/$branch_name | awk '{ print $1 }')
            if [[ -n "$COMMIT_HASH" ]]; then
              COMMIT_URL="https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO/-/commit/$COMMIT_HASH"
              echo "COMMIT_HASH_${var_name}=$COMMIT_HASH" >> "$GITHUB_ENV"
              echo "COMMIT_URL_${var_name}=$COMMIT_URL" >> "$GITHUB_ENV"
            fi
          done

      - name: Generate clean-build release notes
        if: inputs.clean_build
        run: |
          cat > release_body.md << 'EOF'
          ## Clean GKI Build / Clean GKI Build

          This release contains a GKI kernel without KernelSU, SUSFS or other optional feature patches.

          This release contains GKI kernels without KernelSU, SUSFS, or optional feature patches.

          | Component | Status |
          |:---|:---|
          | KernelSU | Not included |
          | SUSFS | Not included |
          | ZRAM, BBG, Re-Kernel, Droidspaces | Not included |

          > Back up the stock boot image before flashing, and verify kernel compatibility with your device.

          **LTO**: thin (Android 16 / 17 use none)

          Click **Assets** below to expand downloads.
          EOF

      - name: Generate standard release notes
        if: inputs.clean_build != true
        run: |
          cat > release_body.md << EOF
          ## 📦 Release Contents

          **${{ env.KSU_NAME }}**${{ env.SUSFS_SUFFIX }}${{ env.LZ4_SUFFIX }}

          ### ✨ Features

          | Component | Status |
          |:---|:---|
          | ${{ env.KSU_NAME }} | ${{ env.BRANCH_INFO }} |
          | SUSFS | ${{ env.SUSFS_STATUS }} |
          | BBG security patch | ${{ env.BBG_STATUS }} |
          | LZ4KD & ONEPLUS_LZ4K | ${{ env.LZ4_STATUS }} |
          | LZ4 | ${{ env.LZ4_STATUS }} |

          ${{ env.COMPATIBILITY_NOTE }}

          ${{ env.HOOK_TYPE }}
          ${{ env.MOUNT_TYPE }}

          > 💡 [Unicode zero-width bypass fix](https://t.me/real5ec1cff/268) - Please use the Xposed module

          ### 📥 Recommended Modules

          - https://github.com/sidex15/ksu_module_susfs

          ---

          > [!IMPORTANT]
          > ### ⚠️ Risk Disclaimer
          >
          > This project combines several **actively maintained upstream components**. Because updates are frequent and components depend on one another, **the following issues may occur**：
          >
          > - 🔄 Bootloop
          > - 🐛 Feature malfunctions or system instability
          >
          > **Before flashing:**
          > 1. Back up the stock boot image so you can restore it
          > 2. Note the current time to help with log analysis
          >
          > ---
          >
          > This project integrates multiple **actively maintained upstream components**. Due to frequent updates and dependencies, **the following issues may occur**:
          >
          > - 🔄 Bootloop
          > - 🐛 Functional issues or system instability
          >
          > **Before flashing, please ensure:**
          > 1. Backup your stock boot image for recovery
          > 2. Note the current time for log analysis

          <details>
          <summary>📋 Post-Flash Guide</summary>

          #### ✅ If boot succeeds / If Boot Successful

          Congratulations! Enjoy your new kernel! 🎉

          Congratulations! Enjoy your new kernel 🎉

          #### ❌ If boot fails / If Boot Failed

          1. Restore the stock boot image
          2. Use KernelSU Manager to extract kernel logs
          3. Submit the logs to [Issues](https://github.com/zzh20188/GKI_KernelSU_SUSFS/issues) or seek help from a specialist

          1. Restore stock boot image
          2. Extract kernel logs using KernelSU Manager
          3. Submit logs to [Issues](https://github.com/zzh20188/GKI_KernelSU_SUSFS/issues) or consult experts

          </details>

          ---

          <details>
          <summary>🔗 Commit Information</summary>

          **KernelSU (BakaSU)**: [${{ env.KSU_REF }}](${{ env.KSU_URL }})

          **SUSFS4KSU**:
          - gki-android12-5.10: [${{ env.COMMIT_HASH_gki_android12_5_10 }}](${{ env.COMMIT_URL_gki_android12_5_10 }})
          - gki-android13-5.10: [${{ env.COMMIT_HASH_gki_android13_5_10 }}](${{ env.COMMIT_URL_gki_android13_5_10 }})
          - gki-android13-5.15: [${{ env.COMMIT_HASH_gki_android13_5_15 }}](${{ env.COMMIT_URL_gki_android13_5_15 }})
          - gki-android14-5.15: [${{ env.COMMIT_HASH_gki_android14_5_15 }}](${{ env.COMMIT_URL_gki_android14_5_15 }})
          - gki-android14-6.1: [${{ env.COMMIT_HASH_gki_android14_6_1 }}](${{ env.COMMIT_URL_gki_android14_6_1 }})
          - gki-android15-6.6: [${{ env.COMMIT_HASH_gki_android15_6_6 }}](${{ env.COMMIT_URL_gki_android15_6_6 }})
          - gki-android16-6.12: [${{ env.COMMIT_HASH_gki_android16_6_12 }}](${{ env.COMMIT_URL_gki_android16_6_12 }})

          </details>

          ---

          **LTO**: thin (Android 16 / 17 use none)

          📂 Click **Assets** below to expand downloads.
          EOF

      - name: Generate version tag
        run: |
          if [ "${{ inputs.clean_build }}" = "true" ]; then
            SUS_VERSION="clean"
          elif [ "${{ inputs.build_target }}" = "android17-6.18" ]; then
            SUS_VERSION="no-susfs"
          else
            SUSFS_INFO_URL="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop?ref_type=heads"
            SUS_VERSION=$(curl --fail --silent --show-error "$SUSFS_INFO_URL" | awk -F '=' '$1 == "version" { print $2; exit }' || true)
          fi
          if [ -z "$SUS_VERSION" ]; then
            echo "Warning: SUSFS version unavailable; using default version"
            SUS_VERSION="1.0.0"
          fi

          MAX_REV=0
          EXISTING_TAGS=$(
            {
              gh api --paginate "repos/$REPO_OWNER/$REPO_NAME/tags?per_page=100" --jq '.[].name'
              gh api --paginate "repos/$REPO_OWNER/$REPO_NAME/releases?per_page=100" --jq '.[].tag_name'
            } | sort -u
          )
          while IFS= read -r TAG; do
            case "$TAG" in
              "$SUS_VERSION"-r*)
                REVISION="${TAG#"$SUS_VERSION-r"}"
                if [[ "$REVISION" =~ ^[0-9]+$ ]] && (( REVISION > MAX_REV )); then
                  MAX_REV=$REVISION
                fi
                ;;
            esac
          done <<< "$EXISTING_TAGS"

          NEW_TAG="${SUS_VERSION}-r$((MAX_REV + 1))"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

          echo "Generating tag: $NEW_TAG"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts

      - name: Verify release artifacts
        run: |
          KERNEL_COUNT=$(find ./downloaded-artifacts -type f -path './downloaded-artifacts/*_kernel-*/*' -name '*AnyKernel3.zip' | wc -l)
          if [ "$KERNEL_COUNT" -eq 0 ]; then
            echo "::error::No publishable AnyKernel3 kernel package found."
            exit 1
          fi
          echo "Kernel package count: $KERNEL_COUNT"

      - name: Create GitHub Release
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.release_type }}" == "Pre-Release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$NEW_TAG" \
            --title "${{ env.RELEASE_NAME }}" \
            --notes-file release_body.md \
            --target "$GITHUB_SHA" \
            --draft \
            $PRERELEASE_FLAG

      - name: Upload kernel artifacts
        run: |
          for file in ./downloaded-artifacts/*_kernel-*/*; do
            [ -d "$file" ] && continue
            [[ "$file" == *-Rejects/* ]] && continue
            echo "Uploading $file..."
            gh release upload "$NEW_TAG" "$file"
          done

      - name: Publish draft release
        run: |
          gh release edit --draft=false "$NEW_TAG"

      - name: Build summary
        run: |
          echo "## Release created" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ inputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Link**: https://github.com/$REPO_OWNER/$REPO_NAME/releases/tag/$NEW_TAG" >> $GITHUB_STEP_SUMMARY

      - name: Send Telegram channel notification
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          set -euo pipefail

          INPUT_COMMIT="${KSU_REF:-}"
          INPUT_COMMIT="${INPUT_COMMIT:0:7}"
          if [ -z "$INPUT_COMMIT" ]; then INPUT_COMMIT="Not included"; fi
          WORKFLOW_COMMIT="${GITHUB_SHA:0:7}"
          INPUT_CHANGE_LOG="${{ inputs.change_log }}"

          TEXT=$(cat <<EOF
          <b>New GKI Release:</b>
          
          Branch: <code>${{ github.ref_name }}</code>
          Commit: ${INPUT_COMMIT}
          Tag: <code>${NEW_TAG}</code>
          
          Features: 
          <pre>Build mode = ${{ inputs.clean_build && 'Clean' || 'BakaSU' }}
          SuSFS = $NOTIFY_SUSFS_STATUS
          BBG = ${{ inputs.clean_build != true && inputs.use_bbg && 'true' || 'false' }}
          LZ4KD = $NOTIFY_ZRAM_STATUS
          Re-Kernel = $NOTIFY_REKERNEL_STATUS
          Droidspaces = ${{ inputs.clean_build && 'off' || inputs.droidspaces }}${{ inputs.clean_build != true && inputs.build_target != 'android17-6.18' && inputs.droidspaces_ntsync && ' + NTSync' || '' }}
          KPatch-Next Support = ${{ inputs.clean_build != true && 'true' || 'false' }}</pre>
          Change Log: 
          <pre>${INPUT_CHANGE_LOG}
          </pre>
          
          Download: <a href="https://github.com/zhuzhuzihan/GKI_BakaSU_SUSFS/releases/tag/${NEW_TAG}">Click Here</a>

          Workflow commit: <code>${WORKFLOW_COMMIT}</code>
          EOF
          )

          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="${TEXT}"
            
      - name: Send Telegram community group notification
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID_2: ${{ secrets.CHAT_ID_2 }}
          message_thread_id: ${{secrets.MESSAGE_THREAD_ID}}
        run: |
          set -euo pipefail

          INPUT_COMMIT="${KSU_REF:-}"
          INPUT_COMMIT="${INPUT_COMMIT:0:7}"
          if [ -z "$INPUT_COMMIT" ]; then INPUT_COMMIT="Not included"; fi
          WORKFLOW_COMMIT="${GITHUB_SHA:0:7}"
          INPUT_CHANGE_LOG="${{ inputs.change_log }}"

          TEXT=$(cat <<EOF
          <b>New GKI Release:</b>
          
          Branch: <code>${{ github.ref_name }}</code>
          Commit: ${INPUT_COMMIT}
          Tag: <code>${NEW_TAG}</code>
          
          Features: 
          <pre>Build mode = ${{ inputs.clean_build && 'Clean' || 'BakaSU' }}
          SuSFS = $NOTIFY_SUSFS_STATUS
          BBG = ${{ inputs.clean_build != true && inputs.use_bbg && 'true' || 'false' }}
          LZ4KD = $NOTIFY_ZRAM_STATUS
          Re-Kernel = $NOTIFY_REKERNEL_STATUS
          Droidspaces = ${{ inputs.clean_build && 'off' || inputs.droidspaces }}${{ inputs.clean_build != true && inputs.build_target != 'android17-6.18' && inputs.droidspaces_ntsync && ' + NTSync' || '' }}
          KPatch-Next Support = ${{ inputs.clean_build != true && 'true' || 'false' }}</pre>
          Change Log: 
          <pre>${INPUT_CHANGE_LOG}
          </pre>
          
          Download: <a href="https://github.com/zhuzhuzihan/GKI_BakaSU_SUSFS/releases/tag/${NEW_TAG}">Click Here</a>

          Workflow commit: <code>${WORKFLOW_COMMIT}</code>
          EOF
          )

          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID_2}" \
            -d message_thread_id="${message_thread_id}" \
            -d parse_mode="HTML" \
            --data-urlencode text="${TEXT}"
