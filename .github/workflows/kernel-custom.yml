name: Build Custom Android Kernel

# 适配 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 内核版本配置 ====================
      android_version:
        description: "Android version"
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
          - android17
        default: android12
      kernel_version:
        description: "Kernel version"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
          - "6.18"
        default: "5.10"
      sub_level:
        description: "Kernel sublevel (e.g., 66, 198, X)"
        required: true
        type: string
        default: "66"
      os_patch_level:
        description: "OS patch level (e.g., 2022-01, lts)"
        required: true
        type: string
        default: "2022-01"
      revision:
        description: "Revision (e.g., r11; required only for 5.10)"
        required: false
        type: string
        default: "r11"

      # ==================== KernelSU 配置 ====================
      # KernelSU 变体固定为 BakaSU
      kernelsu_branch:
        description: "BakaSU branch (main/builtin/custom commit hash; leave blank to use the default)"
        required: false
        type: string
        default: ""

      # ==================== 可选配置 ====================
      version:
        description: "Custom version name (optional)"
        required: false
        type: string
      build_time:
        description: "Custom build time (optional; enter N or leave blank to use the current UTC time)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 功能开关 ====================
      clean_build:
        description: "Clean build (without KernelSU, SUSFS, or optional patches)"
        type: boolean
        default: false

      use_zram:
        description: "Enable enhanced ZRAM algorithms"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "Enable the BBG anti-brick patch"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel drivers"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply the CVE-2026-43499 rtmutex patch series"
        required: false
        type: boolean
        default: true
      cancel_susfs:
        description: "Disable SUSFS"
        required: true
        type: boolean
        default: false
      supp_op:
        description: "Enable OnePlus 8E support"
        required: false
        type: boolean
        default: false
      droidspaces:
        description: "Droidspaces container support (5.10-6.6: slot patch options; 6.12+: on/off)"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      droidspaces_ntsync:
        description: "Enable NTSync support for Droidspaces containers (requires Droidspaces to be enabled)"
        required: false
        type: boolean
        default: false
      build_bypass:
        description: "Build both standard and Bypass kernels"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "Enable NoMount mount support (requires the companion module)"
        required: false
        type: boolean
        default: false
      apply_custom_patches:
        description: "Apply custom patches in numeric filename order"
        required: false
        type: boolean
        default: false

jobs:
  validate-custom-kmi:
    runs-on: ubuntu-latest
    steps:
      - name: 验证 Android 与内核版本配对
        env:
          ANDROID_VERSION: ${{ inputs.android_version }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: |
          case "$ANDROID_VERSION-$KERNEL_VERSION" in
            android12-5.10|android13-5.10|android13-5.15|android14-5.15|android14-6.1|android15-6.6|android16-6.12|android17-6.18)
              ;;
            *)
              echo "::error::不支持的 Android/KMI 组合: $ANDROID_VERSION / $KERNEL_VERSION"
              exit 1
              ;;
          esac

  build-custom-kernel:
    name: "${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}"
    needs: validate-custom-kmi
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      clean_build: ${{ inputs.clean_build }}
      android_version: ${{ inputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ inputs.sub_level }}
      os_patch_level: ${{ inputs.os_patch_level }}
      revision: ${{ inputs.revision || '' }}
      ksu_variant: ${{ inputs.clean_build && 'Clean' || 'BakaSU' }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      build_bypass: ${{ inputs.build_bypass || false }}
      apply_custom_patches: ${{ inputs.apply_custom_patches || false }}
