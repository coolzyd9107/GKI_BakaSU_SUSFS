name: Android Kernel Build - Custom
run-name: "${{ inputs.version || 'GKI' }} ${{ inputs.revision }} | ${{ inputs.android_version }} ${{ inputs.kernel_version }}.${{ inputs.sub_level }} ${{ inputs.os_patch_level }} | ${{ inputs.clean_build && 'Clean' || 'BakaSU' }}"

# Use Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== Kernel version configuration ====================
      android_version:
        description: "Android version"
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
          - android17
        default: android12
      kernel_version:
        description: "Kernel version"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
          - "6.18"
        default: "5.10"
      sub_level:
        description: "Sublevel (e.g. 66, 198, X)"
        required: true
        type: string
        default: "66"
      os_patch_level:
        description: "Security patch level (e.g. 2022-01, lts)"
        required: true
        type: string
        default: "2022-01"
      revision:
        description: "Revision (e.g. r11, required for 5.10 only)"
        required: false
        type: string
        default: "r11"

      # ==================== KernelSU configuration ====================
      # KernelSU variant is fixed to BakaSU
      kernelsu_branch:
        description: "KSU branch (main/builtin/custom commit hash; blank uses default)"
        required: false
        type: string
        default: ""

      # ==================== Optional configuration ====================
      version:
        description: "Custom version name (optional)"
        required: false
        type: string
      build_time:
        description: "Build time: N = current UTC; or enter e.g. Sat Oct 10 19:10:00 UTC 2026"
        required: false
        type: string
        default: "N"

      # ==================== Feature toggles ====================
      clean_build:
        description: "Clean build (no KernelSU, SUSFS or optional patches)"
        type: boolean
        default: false

      use_zram:
        description: "Enable enhanced ZRAM compression"
        required: true
        type: boolean
        default: false
      use_nomount:
        description: 'Enable NoMount (hide mount points)'
        required: false
        type: boolean
        default: true
      use_bbg:
        description: "Enable BBG anti-bricking protection"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel driver"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply CVE-2026-43499 rtmutex fix series"
        required: false
        type: boolean
        default: true
      cancel_susfs:
        description: "Disable SUSFS"
        required: true
        type: boolean
        default: false
      supp_op:
        description: "Enable OnePlus 8E support"
        required: false
        type: boolean
        default: false
      droidspaces:
        description: "Droidspaces container support (5.10–6.6: slot patches; 6.12+: enable/disable)"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      droidspaces_ntsync:
        description: "Enable NTSync for Droidspaces containers (requires Droidspaces)"
        required: false
        type: boolean
        default: false
      build_bypass:
        description: "Build both standard and Bypass kernels"
        required: false
        type: boolean
        default: false

jobs:
  validate-custom-kmi:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Android/kernel version pairing
        env:
          ANDROID_VERSION: ${{ inputs.android_version }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: |
          case "$ANDROID_VERSION-$KERNEL_VERSION" in
            android12-5.10|android13-5.10|android13-5.15|android14-5.15|android14-6.1|android15-6.6|android16-6.12|android17-6.18)
              ;;
            *)
              echo "::error::Unsupported Android/KMI combination: $ANDROID_VERSION / $KERNEL_VERSION"
              exit 1
              ;;
          esac

  build-custom-kernel:
    name: "${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}"
    needs: validate-custom-kmi
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      clean_build: ${{ inputs.clean_build }}
      android_version: ${{ inputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ inputs.sub_level }}
      os_patch_level: ${{ inputs.os_patch_level }}
      revision: ${{ inputs.revision || '' }}
      ksu_variant: ${{ inputs.clean_build && 'Clean' || 'BakaSU' }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_nomount: ${{ inputs.use_nomount }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      build_bypass: ${{ inputs.build_bypass || false }}

  validation-report:
    name: Validation failure summary
    needs: validate-custom-kmi
    if: always() && needs.validate-custom-kmi.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report build not started
        env:
          BUILD_INPUTS: ${{ toJSON(inputs) }}
          VALIDATION_RESULT: ${{ needs.validate-custom-kmi.result }}
        run: |
          python3 - <<'PY_REPORT'
          import os
          import io

          # UI text is translated before interpolation; user inputs and commit IDs remain unchanged.
          TRANSLATIONS = {'## Build not started\n\n': ['## Build belum dimulai\n\n', '## 构建尚未开始\n\n'],
           'No features have been applied and no ZIP has been produced. Check the validation logs.\n\n': ['Belum '
                                                                                                          'ada '
                                                                                                          'fitur '
                                                                                                          'yang '
                                                                                                          'diterapkan '
                                                                                                          'dan '
                                                                                                          'belum '
                                                                                                          'ada '
                                                                                                          'ZIP. '
                                                                                                          'Periksa '
                                                                                                          'log '
                                                                                                          'validasi.\n'
                                                                                                          '\n',
                                                                                                          '尚未应用任何功能，也未生成 '
                                                                                                          'ZIP。请检查验证日志。\n'
                                                                                                          '\n'],
           'Validation result: ': ['Hasil validasi: ', '验证结果：'],
           '| Requested setting | Value |\n|---|---|\n': ['| Pengaturan diminta | Nilai |\n|---|---|\n',
                                                          '| 请求的设置 | 值 |\n|---|---|\n']}

          def render_summary(language):
              def t(text):
                  return text if language == "en" else TRANSLATIONS[text][0 if language == "id" else 1]
              import html, json, os
              i = json.loads(os.environ['BUILD_INPUTS'])

              def esc(value):
                  return html.escape(str(value)).replace('|', '&#124;').replace('\n', ' ').replace('\r', ' ')
              f = io.StringIO()
              if True:
                  f.write(t('## Build not started\n\n'))
                  f.write(t('Validation result: ') + esc(os.environ['VALIDATION_RESULT']) + '\n\n')
                  f.write(t('No features have been applied and no ZIP has been produced. Check the validation logs.\n\n'))
                  f.write(t('| Requested setting | Value |\n|---|---|\n'))
                  for key, value in i.items():
                      f.write(f'| {esc(key)} | {esc(value)} |\n')
              return f.getvalue()

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# Cogan Kernel for GKI2 Devices\n\n')
              summary.write('Select language / Pilih bahasa / 选择语言\n\n')
              for language, title in [('en', 'English'), ('id', 'Bahasa Indonesia'), ('zh', '简体中文')]:
                  summary.write(f'<details>\n<summary>{title}</summary>\n\n')
                  summary.write(render_summary(language))
                  summary.write('\n\n</details>\n\n')
          print('::notice title=Cogan build summary::English / Bahasa Indonesia / 简体中文 — see the job summary.')
          PY_REPORT
