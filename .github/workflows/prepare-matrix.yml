name: Prepare GKI Build Matrix

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      data_file:
        description: "GKI version data file"
        required: true
        type: string
      deduplicate_sublevels:
        description: "Keep only the first patch level for each kernel subversion"
        required: false
        type: boolean
        default: true
      kernel_filter:
        description: "Specify a full kernel version or major-version.X; blank builds the full matrix"
        required: false
        type: string
        default: ""
    outputs:
      matrix:
        description: "GitHub Actions build matrix"
        value: ${{ jobs.prepare.outputs.matrix }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate build matrix
        id: matrix
        env:
          DATA_FILE: ${{ inputs.data_file }}
          DEDUPLICATE_SUBLEVELS: ${{ inputs.deduplicate_sublevels }}
          KERNEL_FILTER: ${{ inputs.kernel_filter }}
        run: |
          args=("$DATA_FILE")
          if [ -n "$KERNEL_FILTER" ]; then
            args+=(--kernel-filter "$KERNEL_FILTER")
          fi
          if [ "$DEDUPLICATE_SUBLEVELS" = "true" ]; then
            args+=(--deduplicate-sublevels)
          fi

          matrix=$(python scripts/prepare_matrix.py "${args[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | python -m json.tool
