# ========================================
# GKI kernel build workflow
# ========================================
# This workflow compiles Android GKI kernels with BakaSU, SUSFS, or clean GKI builds
# Invoked by other workflows via workflow_call, not triggered manually
# ========================================

name: Kernel Build Pipeline

# Use Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      # ==================== Basic configuration ====================
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string

      # ==================== KernelSU configuration ====================
      ksu_variant:
        required: true
        type: string
      ksu_branch:
        required: true
        type: string

      # ==================== Optional configuration ====================
      version:
        required: false
        type: string
      revision:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "N"

      # ==================== Feature toggles ====================
      clean_build:
        required: false
        type: boolean
        default: false
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: true
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: true
      enable_susfs:
        required: true
        type: boolean
      supp_op:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
        default: "off"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      build_bypass:
        required: false
        type: boolean
        default: false

jobs:
  build-kernel:
    name: "${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}${{ inputs.revision && format('-{0}', inputs.revision) || '' }}-${{ inputs.clean_build && 'Clean' || inputs.ksu_variant }}"
    runs-on: ubuntu-latest
    # Bypass mode includes a second build and reserves time for retries on each build.
    timeout-minutes: ${{ inputs.build_bypass && 180 || 60 }}

    # ==================== Environment variable configuration ====================
    # ccache speeds up repeated builds
    env:
      BUILD_VARIANT: ${{ inputs.clean_build && 'Clean' || inputs.ksu_variant }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      # ==================== Build configuration summary ====================
      # Print all current build settings for debugging and tracking
      - name: Build configuration summary
        id: build_configuration_summary
        run: |
          echo "========================================"
          echo "       Kernel Build Configuration Summary"
          echo "========================================"
          echo "Android version  : ${{ inputs.android_version }}"
          echo "Kernel version      : ${{ inputs.kernel_version }}"
          echo "Sublevel      : ${{ inputs.sub_level }}"
          echo "Patch level      : ${{ inputs.os_patch_level }}"
          echo "Build mode      : $BUILD_VARIANT"
          if [ "${{ inputs.clean_build }}" = "true" ]; then
            echo "KernelSU      : Disabled"
            echo "KSU branch      : Not applicable"
            echo "Droidspaces   : off"
          else
            echo "KernelSU      : ${{ inputs.ksu_variant }}"
            echo "KSU branch      : ${{ inputs.ksu_branch }}"
            echo "Droidspaces   : ${{ inputs.droidspaces }}"
          fi
          echo "Build time      : ${{ inputs.build_time }}"
          echo "Clean build      : ${{ inputs.clean_build }}"
          echo "SUSFS status    : ${{ inputs.clean_build != true && inputs.enable_susfs && !(inputs.android_version == 'android17' && inputs.kernel_version == '6.18') }}"
          echo "NoMount status  : ${{ inputs.clean_build != true && inputs.use_nomount }}"
          echo "ZRAM enhancements     : ${{ inputs.clean_build != true && inputs.use_zram && !(inputs.android_version == 'android17' && inputs.kernel_version == '6.18') }}"
          echo "BBG patch      : ${{ inputs.clean_build != true && inputs.use_bbg }}"
          echo "Re-Kernel     : ${{ inputs.clean_build != true && inputs.use_rekernel && !(inputs.android_version == 'android17' && inputs.kernel_version == '6.18') }}"
          echo "CVE-2026-43499: ${{ inputs.clean_build != true && inputs.cve_2026_43499_patch && inputs.kernel_version != '6.18' }}"
          echo "NTSync        : ${{ inputs.clean_build != true && inputs.droidspaces != 'off' && inputs.droidspaces_ntsync && !(inputs.android_version == 'android17' && inputs.kernel_version == '6.18') }}"
          echo "OnePlus 8E    : ${{ inputs.clean_build != true && inputs.supp_op && !(inputs.android_version == 'android17' && inputs.kernel_version == '6.18') }}"
          echo "Bypass build   : ${{ inputs.build_bypass }}"
          echo "Stock Config  : ${{ inputs.clean_build && 'Disabled' || 'Auto-detect config/stock_defconfig' }}"
          echo "========================================"

      - name: Validate Android and KMI pairing
        id: validate_android_and_kmi_pairing
        if: ${{ (inputs.android_version == 'android17' && inputs.kernel_version != '6.18') || (inputs.kernel_version == '6.18' && inputs.android_version != 'android17') }}
        run: |
          echo "::error::Android 17 supports only KMI 6.18, and KMI 6.18 requires Android 17"
          exit 1

      - name: Report features not yet supported on 6.18
        id: report_features_not_yet_supported_on_6_18
        if: inputs.android_version == 'android17' && inputs.kernel_version == '6.18'
        run: |
          echo "Android 17 / 6.18 automatically skips SUSFS, ZRAM/LZ4KD, NTSync, Re-Kernel and the CVE-2026-43499 patch series."
          if [ "${{ inputs.supp_op }}" = "true" ]; then
            echo "::warning::Android 17 / 6.18: OnePlus 8E-specific patch not yet validated; skipping."
          fi
          echo "Droidspaces uses the upstream kABI patch marked 6.12-or-above; BBG remains enabled."

      # ==================== Free disk space ====================
      # GitHub Actions has limited disk space; remove unnecessary preinstalled software
      - name: Free disk space
        id: free_disk_space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      # ==================== Check out repository code ====================
      - name: Check out repository
        id: check_out_repository
        uses: actions/checkout@v6

      # ==================== Initialize build environment ====================
      # Set paths for kernel sources, patches, tools, and other directories
      - name: Initialize build environment
        id: initialize_build_environment
        run: |
          # Build configuration identifier
          KERNEL_CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
          REVISION_SUFFIX=""
          if [ -n "${{ inputs.revision }}" ]; then
            REVISION_SUFFIX="-${{ inputs.revision }}"
          fi
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}${REVISION_SUFFIX}"
          KERNEL_ROOT="$GITHUB_WORKSPACE/$KERNEL_CONFIG"
          mkdir -p "$KERNEL_ROOT"

          # Export environment variables for subsequent steps
          cat >> $GITHUB_ENV << EOF
          CONFIG=$CONFIG
          KERNEL_ROOT=$KERNEL_ROOT
          DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig
          SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu
          KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
          SUKISU_PATCHES=$GITHUB_WORKSPACE/SukiSU_patch
          ZZH_PATCHES=$GITHUB_WORKSPACE
          ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
          ACTION_BUILD=$GITHUB_WORKSPACE/Action-Build
          AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool
          MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py
          UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py
          BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
          KSU_LATEST_COMMIT_DATE=Disabled
          SUSFS_LATEST_COMMIT_DATE=Disabled
          EOF

          # Download and configure repo (to sync Android kernel sources)
          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

      # ==================== Show configuration file content ====================
      - name: Show configuration information
        id: show_configuration_information
        run: |
          CONFIG_FILE="$GITHUB_WORKSPACE/config/config"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Loading configuration file: $CONFIG_FILE"
            cat "$CONFIG_FILE"
          fi

      # ==================== Install build dependencies ====================
      # Install tools and libraries required for kernel compilation (use apt cache)
      - name: Install build dependencies
        id: install_build_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3 git curl build-essential libssl-dev bison flex libelf-dev dwarves

      # ==================== Configure ccache ====================
      # ccache caches compilation results to speed up later builds
      - name: Configure ccache
        id: configure_ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      # ==================== Restore ccache cache ====================
      - name: Restore ccache cache
        id: restore_ccache_cache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-

      # ==================== Cache toolchain ====================
      # Cache AOSP build tools to avoid downloading them each time
      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: |
            kernel-build-tools
            mkbootimg
          key: toolchain-${{ runner.os }}-v1

      # ==================== Download toolchain ====================
      # Download kernel build tools and mkbootimg from AOSP mirrors
      - name: Download toolchain
        id: download_toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-build-2024
          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg

      # ==================== Generate signing key ====================
      # Generate an RSA key to sign boot.img
      - name: Generate signing key
        id: generate_signing_key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > $BOOT_SIGN_KEY_PATH

      # ==================== Configure Git ====================
      - name: Configure Git
        id: configure_git
        run: |
          git config --global user.name "BuildBot"
          git config --global user.email "BuildGkiKernel@gmail.com"

      # ==================== Clone dependency repositories ====================
      # AnyKernel3 is always needed; clean builds skip repositories for unused features
      - name: Clone dependency repositories
        id: clone_dependency_repositories
        run: |
          ANYKERNEL_REPO="https://github.com/coolzyd9107/AnyKernel3.git"
          ANYKERNEL_BRANCH="master"
          if [ "${{ inputs.build_bypass }}" = "true" ]; then
            # The bypass menu is maintained against WildKernels' GKI 2.0 tree.
            ANYKERNEL_REPO="https://github.com/WildKernels/AnyKernel3.git"
            ANYKERNEL_BRANCH="gki-2.0"
          fi
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"

          echo "Cloning AnyKernel3..."
          git clone "$ANYKERNEL_REPO" -b "$ANYKERNEL_BRANCH"
          rm -rf AnyKernel3/.git

          if [ "${{ inputs.clean_build }}" = "true" ]; then
            echo "Removing branded information from AnyKernel3 for clean builds..."
            sed -i 's/^kernel.string=.*/kernel.string=Clean GKI kernel build/' AnyKernel3/anykernel.sh
            sed -i '/^ui_print "Our Telegram Channel:"/,$d' AnyKernel3/anykernel.sh
            rm -f AnyKernel3/banner

            if grep -Rqs 'BakaSU' AnyKernel3; then
              echo "::error::Clean-build AnyKernel3 still contains BakaSU identifiers"
              exit 1
            fi

            echo "Clean build does not need SUSFS or feature patch repositories; skipping download."
            exit 0
          fi

          if [[ "${{ inputs.android_version }}-${{ inputs.kernel_version }}" == "android17-6.18" ]]; then
            echo "No upstream SUSFS branch for Android 17 / 6.18; skipping clone."
          else
            echo "Cloning SUSFS (branch: $SUSFS_BRANCH)..."
            # BakaSU uses simonpunk's original SUSFS
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"

            # Check whether a custom commit is specified
            CONFIG_FILE="config/config"
            if [ -f "$CONFIG_FILE" ]; then
              CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2)
              if [ "$CUSTOM_ENABLED" == "true" ]; then
                CUSTOM_COMMIT=$(grep "^${SUSFS_BRANCH}=" "$CONFIG_FILE" | cut -d'=' -f2)
                if [ -n "$CUSTOM_COMMIT" ]; then
                  echo "Switching SUSFS to custom commit: $CUSTOM_COMMIT"
                  cd susfs4ksu
                  git checkout "$CUSTOM_COMMIT"
                  cd ..
                fi
              fi
            fi

            SUSFS_LATEST_COMMIT_DATE=$(git -C susfs4ksu log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
            echo "SUSFS_LATEST_COMMIT_DATE=$SUSFS_LATEST_COMMIT_DATE" >> $GITHUB_ENV
            echo "Latest SUSFS repository commit date: $SUSFS_LATEST_COMMIT_DATE"
          fi

          echo "Preparing patch resources..."
          git clone https://github.com/WildKernels/kernel_patches.git
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          echo "Using patch directory in current repository: $ZZH_PATCHES"
          git clone https://github.com/Numbersf/Action-Build.git --depth=1

      # ==================== Initialize and sync kernel sources ====================
      # Use repo to fetch GKI kernel sources from AOSP
      - name: Initialize and sync kernel sources
        id: initialize_and_sync_kernel_sources
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          retry() {
            local max_attempts="$1"
            local base_delay="$2"
            shift 2

            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::Command failed after $max_attempts attempts: $*" >&2
                return 1
              fi

              local delay=$((base_delay * attempt))
              echo "::warning::Command failed，${delay} retry in seconds ($attempt/$max_attempts): $*" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          # Clone GCC toolchain (for 5.x kernels)
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1.git gcc

          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          echo "Initializing repo, branch: common-${FORMATTED_BRANCH}"

          retry 4 15 "$REPO" init --depth=1 -u https://android.googlesource.com/kernel/manifest -b "common-${FORMATTED_BRANCH}" --repo-rev=v2.16

          # Check whether the branch is deprecated
          REMOTE_BRANCH=$(retry 4 15 git ls-remote --heads https://android.googlesource.com/kernel/common "refs/heads/${FORMATTED_BRANCH}")
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml

          if [ -n "${{ inputs.revision }}" ] && [ "${{ inputs.os_patch_level }}" != "lts" ]; then
            RELEASE_TAG="${FORMATTED_BRANCH}_${{ inputs.revision }}"
            TAG_REF=$(retry 4 15 git ls-remote --tags --refs https://android.googlesource.com/kernel/common "refs/tags/${RELEASE_TAG}")
            if [ -z "$TAG_REF" ]; then
              echo "::error::Release tag specified in JSON was not found: $RELEASE_TAG" >&2
              exit 1
            fi
            sed -i "s|revision=\"${FORMATTED_BRANCH}\"|revision=\"refs/tags/${RELEASE_TAG}\"|" "$DEFAULT_MANIFEST_PATH"
            if ! grep -qF "revision=\"refs/tags/${RELEASE_TAG}\"" "$DEFAULT_MANIFEST_PATH"; then
              echo "::error::Could not set kernel/common release tag in manifest" >&2
              exit 1
            fi
          elif [ -z "$REMOTE_BRANCH" ] && [ -n "$(retry 4 15 git ls-remote --heads https://android.googlesource.com/kernel/common "refs/heads/deprecated/${FORMATTED_BRANCH}")" ]; then
            echo "Detected deprecated branch: $FORMATTED_BRANCH"
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
          elif [ -z "$REMOTE_BRANCH" ]; then
            # Upstream may delete date-based branches while retaining release tags for that month.
            TAG_REFS=$(retry 4 15 git ls-remote --tags --refs https://android.googlesource.com/kernel/common "refs/tags/${FORMATTED_BRANCH}_r*")
            if [ -z "$TAG_REFS" ]; then
              echo "::error::Not found $FORMATTED_BRANCH branch or its matching release tag" >&2
              exit 1
            fi
            RELEASE_TAG=$(printf '%s\n' "$TAG_REFS" | awk '{print $2}' | sed 's|^refs/tags/||' | sort -V | tail -n1)
            echo "Branch was removed; using release tag: $RELEASE_TAG"
            sed -i "s|revision=\"${FORMATTED_BRANCH}\"|revision=\"refs/tags/${RELEASE_TAG}\"|" "$DEFAULT_MANIFEST_PATH"
            if ! grep -qF "revision=\"refs/tags/${RELEASE_TAG}\"" "$DEFAULT_MANIFEST_PATH"; then
              echo "::error::Could not set kernel/common release tag in manifest" >&2
              exit 1
            fi
          fi

          retry 3 30 "$REPO" --trace sync -c "-j$(nproc --all)" --no-tags --fail-fast
          if [ -n "${RELEASE_TAG:-}" ]; then
            ACTUAL_SUBLEVEL=$(awk '/^SUBLEVEL = / {print $3; exit}' common/Makefile)
            if [ "$ACTUAL_SUBLEVEL" != "${{ inputs.sub_level }}" ]; then
              echo "::error::${RELEASE_TAG} has sublevel $ACTUAL_SUBLEVEL，expected ${{ inputs.sub_level }}" >&2
              exit 1
            fi
          fi
          echo "REMOTE_BRANCH=$REMOTE_BRANCH" >> $GITHUB_ENV

      # ==================== Spoof /proc/config.gz (auto-detect) ====================
      # Auto-apply config/stock_defconfig when present; otherwise skip
      - name: Apply stock config spoofing
        id: apply_stock_config_spoofing
        if: inputs.clean_build != true
        run: |
          # Repository stock_defconfig source and kernel source destination
          STOCK_SRC="$GITHUB_WORKSPACE/config/stock_defconfig"
          STOCK_DST="$KERNEL_ROOT/common/arch/arm64/configs/stock_defconfig"

          # Skip when stock_defconfig is absent; do not affect the main build
          if [ ! -f "$STOCK_SRC" ]; then
            echo "Not detected $STOCK_SRC，skipping stock config spoofing。"
            exit 0
          fi

          # Ensure destination directory exists to prevent cp failure
          mkdir -p "$(dirname "$STOCK_DST")"
          if ! cp "$STOCK_SRC" "$STOCK_DST"; then
            echo "::error::Failed to copy stock_defconfig: $STOCK_SRC -> $STOCK_DST"
            exit 1
          fi
          echo "Copied stock_defconfig -> $STOCK_DST"

          # Rule replacement target is common/kernel/Makefile (matches the current directory structure)
          NEW_RULE='$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE'
          OLD_RULE='$(obj)/config_data: $(KCONFIG_CONFIG) FORCE'
          TARGET_MAKEFILE="$KERNEL_ROOT/common/kernel/Makefile"

          # Fail if target Makefile is missing to avoid modifying unrelated files
          if [ ! -f "$TARGET_MAKEFILE" ]; then
            echo "::error::Not found $TARGET_MAKEFILE"
            exit 1
          fi

          # Only two states are allowed: already updated, or old rule found and replaced; all others are errors
          if grep -qF "$NEW_RULE" "$TARGET_MAKEFILE"; then
            echo "config_data rule already uses stock_defconfig; skipping."
          elif grep -qF "$OLD_RULE" "$TARGET_MAKEFILE"; then
            sed -i 's|\$(obj)/config_data: \$(KCONFIG_CONFIG) FORCE|$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE|' "$TARGET_MAKEFILE"
            echo "Replaced config_data rule: $TARGET_MAKEFILE"
          else
            echo "::error::Could not find rule in $TARGET_MAKEFILE: $OLD_RULE"
            exit 1
          fi

      # ==================== Extract actual sublevel ====================
      # Read the actual SUBLEVEL value from Makefile
      - name: Extract actual sublevel
        id: extract_actual_sublevel
        run: |
          ACTUAL_SUBLEVEL="${{ inputs.sub_level }}"
          if [[ -f "$KERNEL_ROOT/common/Makefile" ]]; then
            EXTRACTED=$(grep '^SUBLEVEL = ' "$KERNEL_ROOT/common/Makefile" | awk '{print $3}')
            [[ -n "$EXTRACTED" ]] && ACTUAL_SUBLEVEL="$EXTRACTED"
          fi
          echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
          echo "Actual sublevel: $ACTUAL_SUBLEVEL"

      # ==================== Fix missing upstream vm_flags_clear declaration ====================
      # When Google backported 16KB page-migration support to some GKI branches (such as deprecated/android12-5.10-2024-11),
      # mm/mmap.c called vm_flags_clear(), but its helper was not declared in the included headers,
      # so implicit declaration errors fail compilation under -Werror. This is an upstream issue unrelated to SUSFS,
      # so it must not be inside the "Apply SUSFS patches" step (skipped if SUSFS is disabled).
      # Detect actual state: substitute equivalent bit operations only when mmap.c calls the helper but no header declares it.
      - name: Fix missing upstream vm_flags_clear declaration
        id: fix_missing_upstream_vm_flags_clear_declaration
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          if grep -q 'vm_flags_clear(' mm/mmap.c && ! grep -rqs --include='*.h' 'vm_flags_clear' include/; then
            echo "mm/mmap.c calls vm_flags_clear() without a header declaration; replacing with bit operations..."
            sed -i -E 's/vm_flags_clear\(([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*,[[:space:]]*([^;()]+)\);/\1->vm_flags \&= ~(\2);/g' mm/mmap.c
            if grep -q 'vm_flags_clear(' mm/mmap.c; then
              echo "::error::Some vm_flags_clear() calls in mm/mmap.c could not be automatically replaced; inspect manually"
              exit 1
            fi
            echo "Fixed vm_flags_clear() calls in mm/mmap.c"
          else
            echo "No fix needed: header declares vm_flags_clear() or mm/mmap.c does not call it"
          fi

      # ==================== Apply rtmutex CVE fix series ====================
      # Use the synced SUBLEVEL to avoid applying fixes already present in upstream LTS
      - name: Auto-apply CVE-2026-43499 rtmutex fix series
        id: auto_apply_cve_2026_43499_rtmutex_fix_series
        if: inputs.clean_build != true && inputs.cve_2026_43499_patch
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          bash "$GITHUB_WORKSPACE/security_patch/apply_cve_2026_43499.sh" \
            "${{ inputs.kernel_version }}" \
            "$ACTUAL_SUBLEVEL" \
            "$GITHUB_WORKSPACE/security_patch"

      # ==================== Fix glibc 2.38 compatibility issue ====================
      # Some older kernels fail to compile with newer glibc and require patches
      - name: Fix glibc 2.38 compatibility
        id: fix_glibc_2_38_compatibility
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          RAW_SUB="${{ inputs.sub_level }}"
          [[ ! "$RAW_SUB" =~ ^[0-9]+$ ]] && CURRENT_SUB=99999 || CURRENT_SUB=$RAW_SUB

          NEEDS_FIX=false
          if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.10" && $CURRENT_SUB -le 186 ]] ||
             [[ "${{ inputs.kernel_version }}" == "5.15" && $CURRENT_SUB -le 119 ]] ||
             [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" && $CURRENT_SUB -le 43 ]]; then
            NEEDS_FIX=true
          fi

          if [ "$NEEDS_FIX" = true ]; then
            GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
            if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
              echo "Applying glibc 2.38 compatibility fix..."
              sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true

              if [[ "${{ inputs.kernel_version }}" == "5.10" || "${{ inputs.kernel_version }}" == "5.15" ]]; then
                sed -i '/char \*buf = NULL;/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++) {/for (i = 0; subcommands[i]; i++) {/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i '/if (subcommands) {/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++)/for (i = 0; subcommands[i]; i++)/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              fi
            fi
          fi

      # ==================== OnePlus 8E processor support ====================
      # Add support patches for OnePlus 8E processor devices
      - name: Add OnePlus 8E processor support
        id: add_oneplus_8e_processor_support
        if: ${{ inputs.clean_build != true && inputs.supp_op && !(inputs.android_version == 'android17' && inputs.kernel_version == '6.18') }}
        working-directory: ${{ env.KERNEL_ROOT }}/common/drivers
        run: |
          echo "Downloading OnePlus 8E support patch..."
          curl -LSs "https://github.com/zzh20188/GKI_KernelSU_SUSFS/raw/refs/heads/dev/hmbird_patch.c" -o hmbird_patch.c
          echo "obj-y += hmbird_patch.o" >> Makefile

      # ==================== Determine KernelSU branch ====================
      # BakaSU supports custom branches or commit hashes
      - name: Determine KernelSU branch
        id: ksu-branch
        if: inputs.clean_build != true
        run: |
          branch_input="${{ inputs.ksu_branch }}"

          # Use the supplied custom branch or commit hash directly
          if [ -n "$branch_input" ]; then
            BRANCH="$branch_input"
            echo "Using custom branch/commit: $branch_input"
          else
            # BakaSU uses the main branch by default
            BRANCH="main"
          fi

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "KSU branch: $BRANCH"

      # ==================== Add KernelSU ====================
      # Add BakaSU
      - name: Add KernelSU
        id: add_kernelsu
        if: inputs.clean_build != true
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -euo pipefail
          echo "Add BakaSU..."
          curl -fLSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s -- "$BRANCH"

          if [ -d "KernelSU/.git" ]; then
            KSU_ACTUAL_REF=$(git -C KernelSU rev-parse HEAD)
            if [[ "$BRANCH" =~ ^[a-fA-F0-9]{40}$ ]] && [[ "${KSU_ACTUAL_REF,,}" != "${BRANCH,,}" ]]; then
              echo "::error::Actual BakaSU commit $KSU_ACTUAL_REF does not match requested commit $BRANCH mismatch"
              exit 1
            fi
            echo "KSU_ACTUAL_REF=$KSU_ACTUAL_REF" >> "$GITHUB_ENV"
            KSU_LATEST_COMMIT_DATE=$(git -C KernelSU log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
            echo "KSU_LATEST_COMMIT_DATE=$KSU_LATEST_COMMIT_DATE" >> "$GITHUB_ENV"
            echo "Latest KSU repository commit date: $KSU_LATEST_COMMIT_DATE"
          else
            echo "::error::KernelSU repository is missing after BakaSU installation"
            exit 1
          fi

      # ==================== Apply SUSFS patches ====================
      # SUSFS (Super User SUS FileSystem) hides traces of root
      - name: Apply SUSFS patches
        id: apply_susfs_patches
        if: ${{ inputs.clean_build != true && inputs.enable_susfs && !(inputs.android_version == 'android17' && inputs.kernel_version == '6.18') }}
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          echo "Apply SUSFS patches..."

          cp $SUSFS4KSU/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./common/
          cp $SUSFS4KSU/kernel_patches/fs/* ./common/fs/
          cp $SUSFS4KSU/kernel_patches/include/linux/* ./common/include/linux/

          case "${{ inputs.ksu_variant }}" in
            "Official")
              cd ./KernelSU
              cp $SUSFS4KSU/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
              # Legacy patch compatibility: replace kernel/Makefile with kernel/Kbuild only if the patch still modifies that file exclusively
              if grep -q '^diff --git a/kernel/Makefile b/kernel/Makefile' ./10_enable_susfs_for_ksu.patch \
                && ! grep -q '^diff --git a/kernel/Kbuild b/kernel/Kbuild' ./10_enable_susfs_for_ksu.patch; then
                sed -i 's|kernel/Makefile|kernel/Kbuild|g' ./10_enable_susfs_for_ksu.patch
              fi
              patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true

              cd ..
              ;;
            "Next"|"SukiSU"|"BakaSU")
              echo "Next/SukiSU/BakaSU uses built-in SUSFS support"
              ;;
          esac

          cd $KERNEL_ROOT/common
          CURRENT_SUB="${{ inputs.sub_level }}"
          if [[ ! "$CURRENT_SUB" =~ ^[0-9]+$ ]]; then
            CURRENT_SUB=99999
          fi

          # Temporarily adjust source context before the main patch, replacing archived wild compatibility fixes
          if [[ "${{ inputs.android_version }}" == "android12" && "${{ inputs.kernel_version }}" == "5.10" ]]; then
            if [[ "$CURRENT_SUB" -le 43 ]]; then
              echo "Temporarily adjust Android 12 5.10 base.c context"
              perl -i -pe 's/(int|size_t)\s+this_len\s*=\s*min_t\s*\(\s*\1\s*,/size_t this_len = min_t(size_t,/;' fs/proc/base.c
            fi
            if [[ "$CURRENT_SUB" -le 117 ]]; then
              echo "Temporarily adjust Android 12 5.10 fdinfo.c context"
              sed -i '/^[[:space:]]*\/\*$/,/^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$/d' fs/notify/fdinfo.c
              perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c
              perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c
            fi
          fi

          if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.10" ]]; then
            if [[ "$CURRENT_SUB" -le 107 ]]; then
              echo "Temporarily adjust Android 13 5.10 fdinfo.c context"
              sed -i '/^[[:space:]]*\/\*$/,/^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$/d' fs/notify/fdinfo.c
              perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c
              perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c
            fi
          fi

          if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" ]]; then
            if [[ "$CURRENT_SUB" -le 41 ]]; then
              echo "Temporarily adjust Android 13 5.15 namespace.c/open.c/fdinfo.c context"
              if ! grep -qF '#include <linux/mnt_idmapping.h>' fs/namespace.c; then
                sed -i '/^#include <linux\/shmem_fs.h>$/a #include <linux/mnt_idmapping.h>' fs/namespace.c
              fi
              if ! grep -qF '#include <linux/mnt_idmapping.h>' fs/open.c; then
                sed -i '/^#include <linux\/compat.h>$/a #include <linux/mnt_idmapping.h>' fs/open.c
              fi
              sed -i '/^[[:space:]]*\/\*$/,/^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$/d' fs/notify/fdinfo.c
              perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c
              perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c
            fi
          fi

          if [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" ]]; then
            if [[ "$CURRENT_SUB" -le 25 ]] && ! grep -qF '#include <trace/hooks/sched.h>' fs/proc/base.c; then
              echo "Temporarily adjust Android 14 6.1 sched.h context"
              sed -i '/^#include <trace\/events\/oom.h>$/a #include <trace/hooks/sched.h>' fs/proc/base.c
            fi
            if [[ "$CURRENT_SUB" -le 141 ]] && ! grep -qF '#include <linux/dma-buf.h>' fs/proc/base.c; then
              echo "Temporarily adjust Android 14 6.1 dma-buf.h context"
              sed -i '/^#include <linux\/cpufreq_times.h>$/a #include <linux/dma-buf.h>' fs/proc/base.c
            fi
            if [[ "$CURRENT_SUB" -ge 157 ]]; then
              echo "Temporarily adjust Android 14 6.1 namespace.c context"
              sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c
            fi
          fi

          if [[ "${{ inputs.android_version }}" == "android15" && "${{ inputs.kernel_version }}" == "6.6" ]]; then
            if [[ "$CURRENT_SUB" -le 30 ]] && ! grep -qF 'last_vma_end = vma->vm_end;' fs/proc/task_mmu.c; then
              echo "Temporarily adjust Android 15 6.6 task_mmu.c context"
              sed -i '/smap_gather_stats(vma, &mss, last_vma_end);/a\last_vma_end = vma->vm_end;' fs/proc/task_mmu.c
            fi
            if [[ "$CURRENT_SUB" -le 92 ]] && ! grep -qF '#include <linux/dma-buf.h>' fs/proc/base.c; then
              echo "Temporarily adjust Android 15 6.6 base.c context"
              sed -i '/^#include <linux\/cpufreq_times.h>$/a #include <linux/dma-buf.h>' fs/proc/base.c
            fi
            if [[ "$CURRENT_SUB" -le 57 ]] && ! grep -qF '#include <linux/zswap.h>' mm/memory.c; then
              echo "Temporarily adjust Android 15 6.6 memory.c context"
              sed -i '/^#include <linux\/sched\/sysctl.h>$/a #include <linux/zswap.h>' mm/memory.c
            fi
          fi

          if [[ "${{ inputs.android_version }}" == "android16" && "${{ inputs.kernel_version }}" == "6.12" ]]; then
            if [[ "$CURRENT_SUB" -ge 58 ]]; then
              echo "Temporarily adjust Android 16 6.12 exec.c context"
              sed -i '/^#include <linux\/dma-buf.h>$/d' fs/exec.c
            fi
          fi

          patch -p1 < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true

          # Restore temporary context after the main patch to avoid unrelated source changes in final artifacts
          if [[ "${{ inputs.android_version }}" == "android12" && "${{ inputs.kernel_version }}" == "5.10" ]]; then
            if [[ "$CURRENT_SUB" -le 43 ]]; then
              echo "Restore Android 12 5.10 base.c Temporarily adjust"
              sed -i 's/^size_t this_len = min_t(size_t, count, PAGE_SIZE);$/int this_len = min_t(int, count, PAGE_SIZE);/' fs/proc/base.c
            fi
            if [[ "$CURRENT_SUB" -le 117 ]]; then
              echo "Restore Android 12 5.10 fdinfo.c Temporarily adjust"
              perl -i -pe 's/^(\s+if \(inode\) \{)/$1\n\t\t\/\*\n\t\t * IN_ALL_EVENTS represents all of the mask bits\n\t\t * that we expose to userspace.  There is at\n\t\t * least one bit (FS_EVENT_ON_CHILD) which is\n\t\t * used only internally to the kernel.\n\t\t *\/\n\t\tu32 mask = mark->mask & IN_ALL_EVENTS;/m' fs/notify/fdinfo.c
              perl -i -pe 's/\binotify_mark_user_mask\(mark\)/mask, mark->ignored_mask/g' fs/notify/fdinfo.c
              perl -i -pe 's/ignored_mask:0/ignored_mask:%x/g' fs/notify/fdinfo.c
            fi
          fi

          if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.10" ]]; then
            if [[ "$CURRENT_SUB" -le 107 ]]; then
              echo "Restore Android 13 5.10 fdinfo.c Temporarily adjust"
              perl -i -pe 's/^(\s+if \(inode\) \{)/$1\n\t\t\/\*\n\t\t * IN_ALL_EVENTS represents all of the mask bits\n\t\t * that we expose to userspace.  There is at\n\t\t * least one bit (FS_EVENT_ON_CHILD) which is\n\t\t * used only internally to the kernel.\n\t\t *\/\n\t\tu32 mask = mark->mask & IN_ALL_EVENTS;/m' fs/notify/fdinfo.c
              perl -i -pe 's/\binotify_mark_user_mask\(mark\)/mask, mark->ignored_mask/g' fs/notify/fdinfo.c
              perl -i -pe 's/ignored_mask:0/ignored_mask:%x/g' fs/notify/fdinfo.c
            fi
          fi

          if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" ]]; then
            if [[ "$CURRENT_SUB" -le 41 ]]; then
              echo "Restore Android 13 5.15 Temporarily adjust"
              sed -i '/#include <linux\/mnt_idmapping.h>$/d' fs/namespace.c
              sed -i '/#include <linux\/mnt_idmapping.h>$/d' fs/open.c
              perl -i -pe 's/^(\s+if \(inode\) \{)/$1\n\t\t\/\*\n\t\t * IN_ALL_EVENTS represents all of the mask bits\n\t\t * that we expose to userspace.  There is at\n\t\t * least one bit (FS_EVENT_ON_CHILD) which is\n\t\t * used only internally to the kernel.\n\t\t *\/\n\t\tu32 mask = mark->mask & IN_ALL_EVENTS;/m' fs/notify/fdinfo.c
              perl -i -pe 's/\binotify_mark_user_mask\(mark\)/mask, mark->ignored_mask/g' fs/notify/fdinfo.c
              perl -i -pe 's/ignored_mask:0/ignored_mask:%x/g' fs/notify/fdinfo.c
              sed -i 's|i_uid_into_mnt(i_user_ns(&fi->inode), &fi->inode).val|i_uid_into_mnt(\&init_user_ns, \&fi->inode).val|g' fs/susfs.c
              sed -i 's|i_uid_into_mnt(i_user_ns(inode), inode).val|i_uid_into_mnt(\&init_user_ns, inode).val|g' fs/susfs.c
            fi
          fi

          if [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" ]]; then
            if [[ "$CURRENT_SUB" -le 25 ]]; then
              sed -i '/^#include <trace\/hooks\/sched.h>$/d' fs/proc/base.c
            fi
            if [[ "$CURRENT_SUB" -le 141 ]]; then
              echo "Restore Android 14 6.1 base.c Temporarily adjust"
              sed -i '/^#include <linux\/dma-buf.h>$/d' fs/proc/base.c
            fi
            if [[ "$CURRENT_SUB" -ge 157 ]] && ! grep -qF '#include <trace/hooks/blk.h>' fs/namespace.c; then
              echo "Restore Android 14 6.1 namespace.c Temporarily adjust"
              sed -i '/^#include "internal.h"$/a #include <trace/hooks/blk.h>' fs/namespace.c
            fi
          fi

          if [[ "${{ inputs.android_version }}" == "android15" && "${{ inputs.kernel_version }}" == "6.6" ]]; then
            if [[ "$CURRENT_SUB" -le 92 ]]; then
              echo "Restore Android 15 6.6 base.c Temporarily adjust"
              sed -i '/^#include <linux\/dma-buf.h>$/d' fs/proc/base.c
            fi
            if [[ "$CURRENT_SUB" -le 57 ]]; then
              echo "Restore Android 15 6.6 memory.c Temporarily adjust"
              sed -i '/^#include <linux\/zswap.h>$/d' mm/memory.c
            fi
          fi

          if [[ "${{ inputs.android_version }}" == "android16" && "${{ inputs.kernel_version }}" == "6.12" ]]; then
            if [[ "$CURRENT_SUB" -ge 58 ]] && ! grep -qF '#include <linux/dma-buf.h>' fs/exec.c; then
              echo "Restore Android 16 6.12 exec.c Temporarily adjust"
              sed -i '0,/^#include /s//#include <linux\/dma-buf.h>\n&/' fs/exec.c
            fi
          fi

          if [ "${{ inputs.ksu_variant }}" == "Official" ] || [ "${{ inputs.ksu_variant }}" == "Next" ] || [ "${{ inputs.ksu_variant }}" == "SukiSU" ] || [ "${{ inputs.ksu_variant }}" == "BakaSU" ]; then
            # Android 12 - 5.10 fixes
            if [[ "${{ inputs.android_version }}" == "android12" && "${{ inputs.kernel_version }}" == "5.10" ]]; then
               if [[ "$CURRENT_SUB" -le 209 ]]; then
                 sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
               fi
               # Fix 5.10 <= .209: define missing VMA_PAD_START macro for compatibility
               if [[ "$CURRENT_SUB" -le 209 ]] && grep -q 'VMA_PAD_START' ./fs/proc/task_mmu.c && ! grep -q 'define VMA_PAD_START' ./fs/proc/task_mmu.c; then
                 sed -i '0,/^#include /s//#ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) (vma->vm_end)\n#endif\n&/' ./fs/proc/task_mmu.c
                 echo "Added to 5.10.$CURRENT_SUB VMA_PAD_START compatibility definition"
               fi
             fi

             # 5.15 fixes
            if [[ "${{ inputs.kernel_version }}" == "5.15" ]]; then
               if [[ "$CURRENT_SUB" -le 148 && "${{ inputs.os_patch_level }}" != "2024-05" ]]; then
                 sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
               fi
               # Fix 5.15 <= .148: define missing VMA_PAD_START macro for compatibility
               if [[ "$CURRENT_SUB" -le 148 ]] && grep -q 'VMA_PAD_START' ./fs/proc/task_mmu.c && ! grep -q 'define VMA_PAD_START' ./fs/proc/task_mmu.c; then
                 sed -i '0,/^#include /s//#ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) (vma->vm_end)\n#endif\n&/' ./fs/proc/task_mmu.c
                 echo "Added to 5.15.$CURRENT_SUB VMA_PAD_START compatibility definition"
               fi
               # Fix 5.15 LTS: task_mmu.c header hunk mismatch leaves SUSFS macros undeclared
              if grep -q 'SUSFS_IS_INODE_SUS_MAP\|SUSFS_IS_INODE_OPEN_REDIRECT' ./fs/proc/task_mmu.c && ! grep -qF '#include <linux/susfs_def.h>' ./fs/proc/task_mmu.c; then
                if grep -qF '#include <linux/pkeys.h>' ./fs/proc/task_mmu.c; then
                  sed -i '/#include <linux\/pkeys.h>/a #if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux\/susfs_def.h>\n#endif' ./fs/proc/task_mmu.c
                elif grep -qF '#include <linux/uaccess.h>' ./fs/proc/task_mmu.c; then
                  sed -i '/#include <linux\/uaccess.h>/a #if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux\/susfs_def.h>\n#endif' ./fs/proc/task_mmu.c
                else
                  sed -i '0,/^#include /s//#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux\/susfs_def.h>\n#endif\n&/' ./fs/proc/task_mmu.c
                fi
                echo "Fixed 5.15 task_mmu.c missing susfs_def.h issue"
              fi
              # Fix 5.15 LTS: SUSFS patch fails to apply the namespace.c header hunk due to a context mismatch,
              # leaving SUSFS symbols (such as DEFAULT_KSU_MNT_ID) undeclared in function bodies
              if grep -q 'DEFAULT_KSU_MNT_ID\|susfs_mnt_id_ida' ./fs/namespace.c && ! grep -qF '#include <linux/susfs_def.h>' ./fs/namespace.c; then
                echo "namespace.c is missing susfs_def.h; injecting declaration..."
                sed -i '/#include <linux\/mnt_idmapping.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include <linux\/susfs_def.h>\n#endif' ./fs/namespace.c
                if ! grep -q 'extern bool susfs_is_current_ksu_domain' ./fs/namespace.c; then
                  sed -i '/#include "internal.h"/a \\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nextern bool susfs_is_current_ksu_domain(void);\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n#define CL_COPY_MNT_NS BIT(25)\n\n#endif' ./fs/namespace.c
                fi
              fi
            fi

            # Android 14 - 6.1 fixes
            if [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" ]]; then
              if grep -q 'susfs_is_current_proc_umounted\|SUSFS_IS_INODE_SUS_MAP\|SUSFS_IS_INODE_OPEN_REDIRECT' ./fs/proc/base.c && ! grep -qF '#include <linux/susfs_def.h>' ./fs/proc/base.c; then
                if grep -qF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                  sed -i '/#include <linux\/dma-buf.h>/a #if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux\/susfs_def.h>\n#endif' ./fs/proc/base.c
                else
                  sed -i '/#include <linux\/cpufreq_times.h>/a #if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux\/susfs_def.h>\n#endif' ./fs/proc/base.c
                fi
              fi
               if [[ "$CURRENT_SUB" -le 75 && "${{ inputs.os_patch_level }}" != "2024-05" ]]; then
                 sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
               fi
               # Fix 6.1 <= .75: define missing VMA_PAD_START macro for compatibility
               if [[ "$CURRENT_SUB" -le 75 ]] && grep -q 'VMA_PAD_START' ./fs/proc/task_mmu.c && ! grep -q 'define VMA_PAD_START' ./fs/proc/task_mmu.c; then
                 sed -i '0,/^#include /s//#ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) (vma->vm_end)\n#endif\n&/' ./fs/proc/task_mmu.c
                 echo "Added to 6.1.$CURRENT_SUB VMA_PAD_START compatibility definition"
               fi
               # Fix 6.1 LTS: SUSFS patch fails to apply the namespace.c header hunk due to a context mismatch,
              # leaving SUSFS symbols (such as DEFAULT_KSU_MNT_ID) undeclared in function bodies
              if grep -q 'DEFAULT_KSU_MNT_ID\|susfs_mnt_id_ida' ./fs/namespace.c && ! grep -qF '#include <linux/susfs_def.h>' ./fs/namespace.c; then
                echo "namespace.c is missing susfs_def.h; injecting declaration..."
                sed -i '/#include <linux\/mnt_idmapping.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include <linux\/susfs_def.h>\n#endif' ./fs/namespace.c
                if ! grep -q 'extern bool susfs_is_current_ksu_domain' ./fs/namespace.c; then
                  sed -i '/#include "internal.h"/a \\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nextern bool susfs_is_current_ksu_domain(void);\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n#define CL_COPY_MNT_NS BIT(25)\n\n#endif' ./fs/namespace.c
                fi
              fi
            fi

            # Android 15 - 6.6 fixes
            if [[ "${{ inputs.android_version }}" == "android15" && "${{ inputs.kernel_version }}" == "6.6" ]]; then
              # Fix 6.6.50–6.6.97: fs/proc/base.c header hunk mismatch omits susfs_def.h
              if grep -q 'AS_FLAGS_SUS_MAP\|susfs_is_current_proc_umounted\|SUSFS_IS_INODE_SUS_MAP\|SUSFS_IS_INODE_OPEN_REDIRECT' ./fs/proc/base.c && ! grep -qF 'susfs_def.h' ./fs/proc/base.c; then
                if ! grep -qF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                  sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
                fi
                sed -i '/#include <linux\/dma-buf.h>/a #endif' ./fs/proc/base.c
                sed -i '/#include <linux\/dma-buf.h>/a #include <linux\/susfs_def.h>' ./fs/proc/base.c
                sed -i '/#include <linux\/dma-buf.h>/a #if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)' ./fs/proc/base.c
              fi
              # Fix early 6.6 branches: missing zswap.h context in memory.c causes SUSFS header hunk failure
              if grep -q 'SUSFS_IS_INODE_SUS_MAP' ./mm/memory.c && ! grep -qF '#include <linux/susfs_def.h>' ./mm/memory.c; then
                if grep -qF '#include <linux/zswap.h>' ./mm/memory.c; then
                  sed -i '/#include <linux\/zswap.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n#include <linux\/susfs_def.h>\n#endif' ./mm/memory.c
                else
                  sed -i '/#include <linux\/sched\/sysctl.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n#include <linux\/susfs_def.h>\n#endif' ./mm/memory.c
                fi
              fi
            fi

            # Android 16 - 6.12 fixes
            if [[ "${{ inputs.android_version }}" == "android16" && "${{ inputs.kernel_version }}" == "6.12" ]]; then
              # Fix duplicate setuid_hook.c definition
              SETUID_HOOK="$KERNEL_ROOT/common/drivers/kernelsu/setuid_hook.c"
              if [ -f "$SETUID_HOOK" ]; then
                sed -i 's/defined(CONFIG_KSU_MANUAL_HOOK))/!defined(CONFIG_KSU_SUSFS) \&\& defined(CONFIG_KSU_MANUAL_HOOK))/' "$SETUID_HOOK"
                echo "Fixed duplicate setuid_hook.c definition"
              fi

              # Fix 6.12.58+: changed exec.c header context causes SUSFS patch to omit susfs_def.h
              if grep -q 'susfs_is_current_proc_umounted' ./fs/exec.c && ! grep -qF '#include <linux/susfs_def.h>' ./fs/exec.c; then
                if grep -qF '#include <linux/dma-buf.h>' ./fs/exec.c; then
                  sed -i '/#include <linux\/dma-buf.h>/a #ifdef CONFIG_KSU_SUSFS\n#include <linux\/susfs_def.h>\n#endif' ./fs/exec.c
                else
                  sed -i '/#include <linux\/ksm.h>/a #ifdef CONFIG_KSU_SUSFS\n#include <linux\/susfs_def.h>\n#endif' ./fs/exec.c
                fi
                echo "Fixed exec.c missing susfs_def.h issue"
              fi
            fi
          fi

      - name: Clone Droidspaces patch repository
        id: clone_droidspaces_patch_repository
        if: inputs.clean_build != true && inputs.droidspaces != 'off'
        run: |
          git clone --depth 1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/Droidspaces-OSS
          echo "DROIDSPACES_PATCHES=/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI" >> $GITHUB_ENV

      # ==================== Back up original defconfig ====================
      # Used later to generate a defconfig fragment (compatible with Bazel trim)
      - name: Back up original defconfig
        id: back_up_original_defconfig
        run: cp "$DEFCONFIG" "$DEFCONFIG.orig"

      - name: Integrate Droidspaces support
        id: integrate_droidspaces_support
        if: inputs.clean_build != true && inputs.droidspaces != 'off'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          KERNEL_VER="${{ inputs.kernel_version }}"
          SLOT="${{ inputs.droidspaces }}"

          # 678 -> 6_7_8, 123 -> 1_2_3, 345 -> 3_4_5
          SLOT_NAME=$(echo "$SLOT" | sed 's/\(.\)/\1_/g; s/_$//')
          echo "Applying Droidspaces SYSVIPC kABI fix patch (slot: $SLOT / $SLOT_NAME)..."
          case "$KERNEL_VER" in
            6.12|6.18)
              PATCH_FILE="$DROIDSPACES_PATCHES/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch"
              ;;
            5.10|5.15|6.1|6.6)
              PATCH_FILE="$DROIDSPACES_PATCHES/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_${SLOT_NAME}.patch"
              ;;
            *)
              echo "::warning::Droidspaces: Unsupported kernel version $KERNEL_VER，skipping patch"
              exit 0
              ;;
          esac
          if ! patch -p1 --forward < "$PATCH_FILE"; then
            echo "::warning::Failed to apply SYSVIPC kABI patch; it may already be applied or the context may not match"
          fi

          # 5.10 and older also require a POSIX_MQUEUE kABI fix
          if [ "$KERNEL_VER" = "5.10" ]; then
            echo "Applying Droidspaces POSIX_MQUEUE kABI fix patch (5.10)..."
            POSIX_PATCH="$DROIDSPACES_PATCHES/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
            if ! patch -p1 --forward < "$POSIX_PATCH"; then
              echo "::warning::Failed to apply POSIX_MQUEUE kABI patch; it may already be applied or the context may not match"
            fi
          fi

          # On Android 16 / 6.12, rust_binder.ko references the following after IPC_NS is enabled:
          # init_ipc_ns and put_ipc_ns, but the current AOSP common branch does not export them.
          # Export these symbols here to prevent undefined-symbol failures during modpost.
          if [ "$KERNEL_VER" = "6.12" ]; then
            if [ -f "ipc/msgutil.c" ] && ! grep -qF 'EXPORT_SYMBOL(init_ipc_ns);' "ipc/msgutil.c"; then
              sed -i '/^struct msg_msgseg {/i EXPORT_SYMBOL(init_ipc_ns);' "ipc/msgutil.c"
              echo "Exported symbol init_ipc_ns"
            fi

            if [ -f "ipc/namespace.c" ] && ! grep -qF 'EXPORT_SYMBOL(put_ipc_ns);' "ipc/namespace.c"; then
              sed -i '/^static struct ns_common \*ipcns_get(/i EXPORT_SYMBOL(put_ipc_ns);' "ipc/namespace.c"
              echo "Exported symbol put_ipc_ns"
            fi
          fi

          echo "Adding Droidspaces kernel configuration..."
          # Process each option: skip if enabled, replace "# not set", or append if missing
          enable_config() {
            local cfg="$1"
            if grep -q "^${cfg}=y" "$DEFCONFIG"; then
              echo "  Enabled: $cfg"
            elif grep -q "^# ${cfg} is not set" "$DEFCONFIG"; then
              sed -i "s/^# ${cfg} is not set$/${cfg}=y/" "$DEFCONFIG"
              echo "  Switched: $cfg"
            else
              echo "${cfg}=y" >> "$DEFCONFIG"
              echo "  Added: $cfg"
            fi
          }

          config_defined() {
            local name="${1#CONFIG_}"
            grep -RqsE --include='Kconfig*' "^[[:space:]]*(menuconfig|config)[[:space:]]+${name}$" .
          }

          enable_config_if_defined() {
            local cfg="$1"
            if config_defined "$cfg"; then
              enable_config "$cfg"
            else
              echo "  Not defined by current kernel: $cfg; skipping"
            fi
          }

          # Required configuration
          enable_config CONFIG_SYSVIPC
          enable_config CONFIG_POSIX_MQUEUE
          enable_config CONFIG_IPC_NS
          enable_config CONFIG_PID_NS
          enable_config CONFIG_DEVTMPFS

          # Optional networking configuration (Docker/NAT mode)
          enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_LOG
          enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_RECENT
          enable_config_if_defined CONFIG_IP_SET
          enable_config_if_defined CONFIG_IP_SET_HASH_IP
          enable_config_if_defined CONFIG_IP_SET_HASH_NET
          enable_config_if_defined CONFIG_NETFILTER_XT_SET

          # REJECT target symbols differ by kernel version; enable only existing options
          enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_REJECT
          enable_config_if_defined CONFIG_IP_NF_TARGET_REJECT

          echo "Droidspaces integration complete"

          echo "GKI 6.6 regular-user networking settings (Droidspaces)"
          # Handle =n configuration options (Android network permission enforcement must be disabled)
          disable_config() {
            local cfg="$1"
            if grep -q "^${cfg}=n" "$DEFCONFIG"; then
              echo "  Disabled: $cfg"
            elif grep -q "^${cfg}=y" "$DEFCONFIG"; then
              sed -i "s/^${cfg}=y$/${cfg}=n/" "$DEFCONFIG"
              echo "  Turned off: $cfg"
            else
              echo "# ${cfg} is not set" >> "$DEFCONFIG"
              echo "  Added and disabled: $cfg"
            fi
          }

          if [[ "${{ inputs.android_version }}" == "android15" && "${{ inputs.kernel_version }}" == "6.6" ]]; then
            # 1. Enable user namespaces (required)
            # enable_config_if_defined CONFIG_USER_NS
            # 2. Disable Android strict network controls (required)
            disable_config CONFIG_ANDROID_PARANOID_NETWORK
          fi

      - name: Inject NTSync kernel configuration
        id: inject_ntsync_kernel_configuration
        if: inputs.clean_build != true && inputs.droidspaces != 'off' && inputs.droidspaces_ntsync
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -e
          echo "=== Start injecting NTSync kernel patch ==="
          echo "Android version: ${{ inputs.android_version }}"
          echo "Kernel version: ${{ inputs.kernel_version }}"

          case "${{ inputs.android_version }}-${{ inputs.kernel_version }}" in
            android12-5.10)
              NTSYNC_PATCH="ntsync_compat_android12-5.10"
              ;;
            android13-5.15)
              NTSYNC_PATCH="ntsync_compat_android13-5.15"
              ;;
            android14-5.15)
              echo "::error::Upstream has not provided an Android 14 / 5.15 NTSync compatibility patch"
              exit 1
              ;;
            android14-6.1)
              NTSYNC_PATCH="ntsync_compat_android14-6.1"
              ;;
            android15-6.6)
              NTSYNC_PATCH="ntsync_compat_android15-6.6"
              ;;
            android16-6.12)
              NTSYNC_PATCH="ntsync_compat_android16-6.12"
              ;;
            *)
              echo "::warning::NTSync: Unsupported on ${{ inputs.android_version }} / ${{ inputs.kernel_version }}，skipping patch"
              exit 0
              ;;
          esac

          echo "Automatically selected NTSync patch: ${NTSYNC_PATCH}.patch"
          wget -q "https://raw.githubusercontent.com/Goldzxcbug/Droidspaces_Kernel_patch/refs/heads/main/NTsync/ntsync_base.patch"
          wget -q "https://raw.githubusercontent.com/Goldzxcbug/Droidspaces_Kernel_patch/refs/heads/main/NTsync/${NTSYNC_PATCH}.patch"

          patch -p1 < "ntsync_base.patch"
          patch -p1 < "${NTSYNC_PATCH}.patch"

          cd ..

          # Configuration path
          CONFIG_PATH="./common/arch/arm64/configs/gki_defconfig"
          echo "Checking and enabling CONFIG_NTSYNC..."

          # Remove disabled marker before appending enabled entry to ensure idempotency.
          sed -i '/CONFIG_NTSYNC is not set/d' "$CONFIG_PATH"
          if ! grep -q "^CONFIG_NTSYNC=y" "$CONFIG_PATH"; then
            echo "CONFIG_NTSYNC=y" >> "$CONFIG_PATH"
            echo "✅ Successfully enabled CONFIG_NTSYNC"
          else
            echo "✅ CONFIG_NTSYNC is already enabled"
          fi

          echo "=== NTSync patch and configuration injection complete ==="

      - name: Apply Unicode bypass fix
        id: apply_unicode_bypass_fix
        if: ${{ inputs.clean_build != true && inputs.enable_susfs && !(inputs.android_version == 'android17' && inputs.kernel_version == '6.18') }}
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          if [ "${{ inputs.kernel_version }}" = "5.10" ] || [ "${{ inputs.kernel_version }}" = "5.15" ]; then
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1-.patch" || true
          else
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1+.patch" || true
          fi

      # ==================== Upgrade LZ4 and apply LZ4KD/LZ4K_OPLUS patches ====================
      # Handle ZRAM-related LZ4 changes together to reduce duplicate steps
      - name: Configure ZRAM LZ4 patch stack
        id: configure_zram_lz4_patch_stack
        if: ${{ inputs.clean_build != true && inputs.use_zram && !(inputs.android_version == 'android17' && inputs.kernel_version == '6.18') }}
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # Stage 1: upgrade LZ4 to 1.10.0 and add ARM64 NEON acceleration
          echo "Upgrading LZ4..."
          rm -f lib/lz4/lz4_compress.c lib/lz4/lz4_decompress.c lib/lz4/lz4defs.h lib/lz4/lz4hc_compress.c

          cp -r $ZZH_PATCHES/zram/lz4/* ./lib/lz4/
          cp -r $ZZH_PATCHES/zram/include/linux/* ./include/linux/
          bash $ZZH_PATCHES/zram/apply_lz4_neon.sh

          if [ -f "fs/f2fs/Makefile" ] && ! grep -qF "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" "fs/f2fs/Makefile"; then
            echo "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" >> "fs/f2fs/Makefile"
          fi

          # Stage 2: apply LZ4KD and LZ4K_OPLUS patches
          cp -r $SUKISU_PATCHES/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/lib/* ./lib/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/crypto/* ./crypto/
          cp -r $SUKISU_PATCHES/other/zram/lz4k_oplus ./lib/

          cp $SUKISU_PATCHES/other/zram/zram_patch/${{ inputs.kernel_version }}/lz4kd.patch ./
          if ! patch -p1 -F 3 < lz4kd.patch; then
            echo "::warning::lz4kd.patch patch failed to apply; it may already be applied or the context may not match"
          fi

          cp $SUKISU_PATCHES/other/zram/zram_patch/${{ inputs.kernel_version }}/lz4k_oplus.patch ./
          if ! patch -p1 -F 3 < lz4k_oplus.patch; then
            echo "::warning::lz4k_oplus.patch patch failed to apply; it may already be applied or the context may not match"
          fi

      # ==================== Fix 6.6 Wi-Fi/Bluetooth compatibility (Samsung + Xiaomi) ====================
      # Combine Samsung and Xiaomi fixes and use idempotent edits to prevent duplicate changes
      - name: Fix 6.6 Wi-Fi/Bluetooth compatibility (Samsung + Xiaomi)
        id: fix_6_6_wi_fi_bluetooth_compatibility_samsung_xiaomi
        if: inputs.clean_build != true && inputs.kernel_version == '6.6'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # Append only if the line is absent to avoid duplicate edits
          ensure_line_once() {
            local file="$1"
            local line="$2"
            if [ ! -f "$file" ]; then
              echo "::error::File does not exist: $file"
              exit 1
            fi
            if ! grep -qF "$line" "$file"; then
              echo "$line" >> "$file"
            fi
          }

          GALAXY_SYMBOL_LIST="android/abi_gki_aarch64_galaxy"
          XIAOMI_SYMBOL_LIST="android/abi_gki_aarch64_xiaomi"
          DRIVERS_MAKEFILE="drivers/Makefile"
          MIN_KDP_SRC="$KERNEL_PATCHES/samsung/min_kdp/min_kdp.c"
          MIN_KDP_PATCH="$KERNEL_PATCHES/samsung/min_kdp/add-min_kdp-symbols.patch"
          MIN_KDP_DST="drivers/min_kdp.c"

          # Samsung: add KDP symbols (idempotent)
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_set_cred_non_rcu"
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_dec_and_test"
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_inc"

          # Samsung: patch only when applicable; skip if already applied or incompatible
          if [ ! -f "$MIN_KDP_PATCH" ]; then
            echo "::error::Patch does not exist: $MIN_KDP_PATCH"
            exit 1
          fi
          if patch -p1 --dry-run < "$MIN_KDP_PATCH" >/dev/null 2>&1; then
            patch -p1 --no-backup-if-mismatch < "$MIN_KDP_PATCH"
          else
            echo "min_kdp symbols patch already applied or context mismatch; skipping."
          fi

          # Samsung: copy driver sources and append to Makefile only once
          if [ ! -f "$MIN_KDP_SRC" ]; then
            echo "::error::File does not exist: $MIN_KDP_SRC"
            exit 1
          fi
          cp "$MIN_KDP_SRC" "$MIN_KDP_DST"
          ensure_line_once "$DRIVERS_MAKEFILE" "obj-y += min_kdp.o"

          # Xiaomi: add symbols (idempotent)
          ensure_line_once "$XIAOMI_SYMBOL_LIST" "device_find_any_child"

      # ==================== Configure ZRAM options ====================
      # Enable ZRAM compression algorithms
      - name: Configure ZRAM options
        id: configure_zram_options
        if: ${{ inputs.clean_build != true && inputs.use_zram && !(inputs.android_version == 'android17' && inputs.kernel_version == '6.18') }}
        run: |
          CONFIG_FILE="$DEFCONFIG"

          # 5.10 requires additional base configuration
          if [ "${{ inputs.kernel_version }}" = "5.10" ]; then
            cat >> "$CONFIG_FILE" <<'EOF'
          CONFIG_ZSMALLOC=y
          CONFIG_ZRAM=y
          CONFIG_MODULE_SIG=n
          CONFIG_CRYPTO_LZO=y
          CONFIG_ZRAM_DEF_COMP_LZ4KD=y
          EOF
          fi

          # 5.15 / 6.1: build modules into the kernel
          if [ "${{ inputs.kernel_version }}" != "6.6" ] && [ "${{ inputs.kernel_version }}" != "5.10" ]; then
            if grep -q "CONFIG_ZSMALLOC" "$CONFIG_FILE"; then
              sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "$CONFIG_FILE"
            else
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            fi
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          fi

          # 6.6: build modules into the kernel
          if [ "${{ inputs.kernel_version }}" = "6.6" ]; then
            echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          fi

          # android14/15: remove zram/zsmalloc module declarations from modules.bzl
          if [ "${{ inputs.android_version }}" = "android14" ] || [ "${{ inputs.android_version }}" = "android15" ]; then
            sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "$KERNEL_ROOT/common/modules.bzl"
          fi

          # Enable compression algorithms (using a separate fragment file)
          if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
            cat "$ZZH_PATCHES/config/zram.config" >> "$CONFIG_FILE"
          fi

      # ==================== Add BBG anti-bricking patch ====================
      # BBG (Baseband Guard) prevents baseband-formatting attacks
      - name: Add BBG anti-bricking patch
        id: add_bbg_anti_bricking_patch
        if: inputs.clean_build != true && inputs.use_bbg
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

      # ==================== Apply Re-Kernel ====================
      # Re-Kernel uses GKI Vendor Hooks for kernel-level protection
      - name: Apply Re-Kernel
        id: apply_re_kernel
        if: ${{ inputs.clean_build != true && inputs.use_rekernel && !(inputs.android_version == 'android17' && inputs.kernel_version == '6.18') }}
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
         set -e
         echo "Integrating Re-Kernel..."
         TMP_REKERNEL=/tmp/rekernel
         rm -rf "$TMP_REKERNEL"
         git clone --depth 1 https://github.com/Sakion-Team/Re-Kernel.git "$TMP_REKERNEL"

         # 1. Menyiapkan dan Menyalin Folder Source
         mkdir -p common/drivers/rekernel
         find "$TMP_REKERNEL" -name "rekernel.c" -exec cp {} common/drivers/rekernel/ \;
         find "$TMP_REKERNEL" -name "rekernel.h" -exec cp {} common/drivers/rekernel/ \;

         # 2. Patching Otomatis file_operations ke proc_ops (Untuk Kernel 6.1)
         echo "Patching rekernel.c for Kernel 6.1 compatibility..."
         sed -i 's/struct file_operations/struct proc_ops/g' common/drivers/rekernel/rekernel.c
         sed -i 's/\.owner = THIS_MODULE,//g' common/drivers/rekernel/rekernel.c
         sed -i 's/\.read =/.proc_read =/g' common/drivers/rekernel/rekernel.c
         sed -i 's/\.write =/.proc_write =/g' common/drivers/rekernel/rekernel.c
         sed -i 's/\.open =/.proc_open =/g' common/drivers/rekernel/rekernel.c
         sed -i 's/\.release =/.proc_release =/g' common/drivers/rekernel/rekernel.c
         sed -i 's/\.unlocked_ioctl =/.proc_ioctl =/g' common/drivers/rekernel/rekernel.c
         sed -i 's/\.compat_ioctl =/.proc_compat_ioctl =/g' common/drivers/rekernel/rekernel.c
         sed -i 's/\.llseek =/.proc_lseek =/g' common/drivers/rekernel/rekernel.c


         # 3. Membuat Kconfig
         cat > common/drivers/rekernel/Kconfig << 'EOF'
         menu "Re:Kernel"
         config REKERNEL
            bool "Re:Kernel support (GKI Vendor Hooks)"
            default y
            help
              Enable Re-Kernel support via GKI Vendor Hooks.

         config REKERNEL_NETWORK
            bool "Re:Kernel NetReceive unfreeze support"
            depends on REKERNEL
            default n
         endmenu
         EOF

         # 4. Membuat Makefile (Termasuk bypass error peringatan compiler)
         cat > common/drivers/rekernel/Makefile << 'EOF'
         obj-$(CONFIG_REKERNEL) += rekernel.o
         ccflags-$(CONFIG_REKERNEL_NETWORK) += -DNETWORK_FILTER
         ccflags-y += -Wno-error -Wno-format -Wno-format-extra-args
         EOF



          # Add to the driver tree
          if ! grep -qF 'source "drivers/rekernel/Kconfig"' common/drivers/Kconfig; then
            sed -i '/^endmenu$/i source "drivers/rekernel/Kconfig"' common/drivers/Kconfig
          fi
          if ! grep -qF 'obj-$(CONFIG_REKERNEL) += rekernel/' common/drivers/Makefile; then
            echo 'obj-$(CONFIG_REKERNEL) += rekernel/' >> common/drivers/Makefile
          fi

          # Enable kernel version macro
          REKERNEL_H="common/drivers/rekernel/rekernel.h"
          VERSION_MACRO="KERNEL_$(echo "${{ inputs.kernel_version }}" | tr '.' '_')"
          if grep -q "^// #define ${VERSION_MACRO}$" "$REKERNEL_H"; then
            sed -i "s|^// #define ${VERSION_MACRO}$|#define ${VERSION_MACRO}|" "$REKERNEL_H"
          fi

          # Fix header include paths for in-tree builds
          sed -i 's|#include <../android/binder_internal.h>|#include "../../drivers/android/binder_internal.h"|g' common/drivers/rekernel/rekernel.c
          # Add binder_internal dependency to prevent DEFINE_SHOW_ATTRIBUTE errors on 5.10
          grep -qF '#include <linux/seq_file.h>' common/drivers/rekernel/rekernel.c || sed -i '/#include <trace\/hooks\/signal.h>/a #include <linux/seq_file.h>' common/drivers/rekernel/rekernel.c

          # Configure defconfig (idempotent)
          grep -q '^CONFIG_REKERNEL=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL=y" >> "$DEFCONFIG"
          grep -q '^CONFIG_REKERNEL_NETWORK=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL_NETWORK=y" >> "$DEFCONFIG"

          # ==================== Apply NoMount ====================
      # Hide mount points to bypass root detection (NoMount)
      - name: Apply NoMount
        id: apply_nomount
        if: inputs.clean_build != true && inputs.use_nomount
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -e
          echo "Integrating NoMount (dev branch)..."
          curl -sSL https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev

          # Enable built-in NoMount kernel configuration
          if ! grep -q "^CONFIG_NOMOUNT=y" "$DEFCONFIG"; then
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG"
            echo "✅ Successfully enabled CONFIG_NOMOUNT"
          fi

      # ==================== Configure kernel options ====================
      # Add KernelSU and other necessary kernel configuration
      - name: Configure kernel options
        id: configure_kernel_options
        if: inputs.clean_build != true
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          CURRENT_SUB="${{ inputs.sub_level }}"
          if [[ ! "$CURRENT_SUB" =~ ^[0-9]+$ ]]; then
            CURRENT_SUB=99999
          fi
          if [[ "${{ inputs.ksu_variant }}" == "BakaSU" && "${{ inputs.kernel_version }}" == "5.15" && "$CURRENT_SUB" -ge 74 && "$CURRENT_SUB" -le 137 ]]; then
            {
              echo "CONFIG_KALLSYMS=y"
              echo "CONFIG_KALLSYMS_ALL=y"
            } >> "$DEFCONFIG"
            # Fix 5.15.74–5.15.137: kallsyms_on_each_symbol built only with LIVEPATCH causes BakaSU link failures
            KALLSYMS_C="./common/kernel/kallsyms.c"
            if [ -f "$KALLSYMS_C" ] \
              && grep -qF 'int kallsyms_on_each_symbol' "$KALLSYMS_C" \
              && grep -qF '#endif /* CONFIG_LIVEPATCH */' "$KALLSYMS_C"; then
              sed -i '/^#ifdef CONFIG_LIVEPATCH$/,/^int kallsyms_on_each_symbol/ { /^#ifdef CONFIG_LIVEPATCH$/d }' "$KALLSYMS_C"
              sed -i '/^int kallsyms_on_each_symbol/,/^#endif \/\* CONFIG_LIVEPATCH \*\// { /^#endif \/\* CONFIG_LIVEPATCH \*\//d }' "$KALLSYMS_C"
              echo "Fixed LIVEPATCH compilation restriction for kallsyms_on_each_symbol"
            fi
          fi

          sed -i 's/check_defconfig//' ./common/build.config.gki

      # ==================== Add SUSFS configuration ====================
      # Enable SUSFS hiding features
      - name: Add SUSFS configuration
        id: add_susfs_configuration
        if: ${{ inputs.clean_build != true && inputs.enable_susfs && !(inputs.android_version == 'android17' && inputs.kernel_version == '6.18') }}
        run: |
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

      # ==================== Configure kernel name ====================
      - name: Configure kernel name
        id: configure_kernel_name
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          if [ -f "build/build.sh" ]; then
            sed -i 's/-dirty//' ./common/scripts/setlocalversion
          else
            # Configure kernels 6.1+
            sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
            sed -i '/kmi_symbol_list_strict_mode/d' ./common/BUILD.bazel
            rm -rf ./common/android/abi_gki_protected_exports_*
            sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
          fi

          # Configure kernel name
          if [ -n "${{ inputs.version }}" ]; then
            CLEAN_VERSION=$(echo "${{ inputs.version }}" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+//')

            # Define KMI_TAG (consistent with automatic versioning)
            case "${{ inputs.android_version }}-${{ inputs.kernel_version }}" in
              "android14-6.1")  KMI_TAG="android14-11" ;;
              "android15-6.6")  KMI_TAG="android15-8" ;;
              "android16-6.12") KMI_TAG="android16-5" ;;
              *) KMI_TAG="${{ inputs.android_version }}" ;;
            esac

            if [ "${{ inputs.kernel_version }}" = "6.1" ]; then
              # 6.1: legacy format with KMI_TAG
              KMI_SUFFIX=$(printf '%s' "$CLEAN_VERSION" | sed 's/^-*//')
              KMI_LOCAL="-${KMI_TAG}${KMI_SUFFIX:+-${KMI_SUFFIX}}"
              sed -i "\$s|echo \"\$res\"|echo \"${KMI_LOCAL}\"|" ./common/scripts/setlocalversion 2>/dev/null || true
              sed -i "/^CONFIG_LOCALVERSION=/ s/=\"[^\"]*\"/=\"${KMI_LOCAL}\"/" ./common/arch/arm64/configs/gki_defconfig 2>/dev/null || true
            elif [ "${{ inputs.kernel_version }}" = "5.10" ] || [ "${{ inputs.kernel_version }}" = "5.15" ]; then
              # 5.x: legacy format without KMI_TAG
              sed -i "\$s|echo \"\$res\"|echo \"${CLEAN_VERSION}\"|" ./common/scripts/setlocalversion 2>/dev/null || true
              sed -i '/^CONFIG_LOCALVERSION=/ s/="\([^"]*\)"/="'"$CLEAN_VERSION"'"/' ./common/arch/arm64/configs/gki_defconfig
            else
              # 6.6+: new setlocalversion format with KMI_TAG
              SUFFIX="-${KMI_TAG}${CLEAN_VERSION}"
              perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${SUFFIX}"'"/s' ./common/scripts/setlocalversion 2>/dev/null || true
            fi
          elif [ ! -f "build/build.sh" ]; then
            cd ./common
            BID="ab$((RANDOM % 90000000 + 10000000))"
            GHASH=$(git rev-parse --verify HEAD | cut -c1-13)
            # Unified kernel naming: -androidXX-KMI-gHASH-BID-4k
            case "${{ inputs.android_version }}-${{ inputs.kernel_version }}" in
              "android14-6.1")  KMI_TAG="android14-11" ;;
              "android15-6.6")  KMI_TAG="android15-8" ;;
              "android16-6.12") KMI_TAG="android16-5" ;;
              *) KMI_TAG="${{ inputs.android_version }}" ;;
            esac

            if [ "${{ inputs.kernel_version }}" = "6.1" ]; then
              # 6.1: inject version name via setlocalversion (legacy format)
              KMI_LOCAL="-${KMI_TAG}-g${GHASH}-${BID}-4k"
              sed -i "\$s|echo \"\$res\"|echo \"${KMI_LOCAL}\"|" ./scripts/setlocalversion 2>/dev/null || true
              sed -i "/^CONFIG_LOCALVERSION=/ s/=\"[^\"]*\"/=\"${KMI_LOCAL}\"/" ./arch/arm64/configs/gki_defconfig 2>/dev/null || true
            else
              # 6.6+: modify setlocalversion to inject version name (new format, based on wild_kernel)
              # Preserve ${KERNELVERSION} and ${config_localversion} for runtime script expansion
              SUFFIX="-${KMI_TAG}-g${GHASH}-${BID}"
              perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${SUFFIX}"'\$\{config_localversion\}"/s' ./scripts/setlocalversion 2>/dev/null || true
            fi
          fi

      # ==================== Experimental short kernel version (r7) ====================
      - name: Shorten compiler label for HyperOS (experimental)
        id: shorten_compiler_label_for_hyperos_experimental
        if: inputs.android_version == 'android14' && inputs.kernel_version == '6.1' && inputs.version != ''
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("common/init/version.c")
          source = path.read_text()
          marker = "const char linux_proc_banner[] ="
          if source.count(marker) != 1:
              raise SystemExit("::error::Unexpected linux_proc_banner declaration")
          start = source.index(marker)
          end = source.find(";", start)
          if end == -1:
              raise SystemExit("::error::Unterminated linux_proc_banner")
          declaration = source[start:end + 1]
          if declaration.count("LINUX_COMPILER") != 1 or "LINUX_COMPILE_BY" not in declaration or "LINUX_COMPILE_HOST" not in declaration:
              raise SystemExit("::error::Unexpected banner structure; refusing unsafe edit")
          updated = declaration.replace("LINUX_COMPILER", '"clang"')
          path.write_text(source[:start] + updated + source[end + 1:])
          print("Short compiler label applied; parenthesized fields preserved")
          PY

      # ==================== Custom build time ====================
      - name: Set custom build time
        id: set_custom_build_time
        shell: bash
        run: |
          # Read input: N/n or blank means current UTC time
          INPUT_TIME="${{ inputs.build_time }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "N" && "$INPUT_TIME" != "n" ]]; then
            DATESTR="$INPUT_TIME"
          else
            DATESTR="$(TZ='UTC' date +'%Y-%m-%d %H:%M:%S UTC')"
          fi

          # Export for subsequent build steps
          echo "Using build time: $DATESTR"
          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

          # Handle mkcompile_h patches consistently
          f="$KERNEL_ROOT/common/scripts/mkcompile_h"
          if [ -f "$f" ]; then
            if [[ "${{ inputs.kernel_version }}" == "5.10" || "${{ inputs.kernel_version }}" == "5.15" ]]; then
              echo "Applying 5.x legacy timestamp patch: $f"
              perl -pi -e "s{UTS_VERSION=\"\\\$\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
            else
              echo "Applying 6.x mkcompile_h patch: $f"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\\(.*?\\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          fi

      # ==================== Compile standard kernel ====================
      # Compile standard kernel with automatic retries after timeouts
      - name: Build standard kernel
        id: build_standard_kernel
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: timeout
          command: |
            echo "::group::Build details"
            echo "Build mode: $BUILD_VARIANT"
            if [ "${{ inputs.clean_build }}" = "true" ]; then
              echo "Clean build excludes KernelSU, SUSFS and optional feature patches."
            else
              echo "KernelSU commit date: ${KSU_LATEST_COMMIT_DATE}"
              echo "SUSFS commit date: ${SUSFS_LATEST_COMMIT_DATE}"
            fi
            echo "::endgroup::"

            set -ex
            cd "$KERNEL_ROOT"

            sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' ./common/build.config.gki.aarch64
            sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' ./common/build.config.gki.aarch64
            sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' ./common/build.config.gki.aarch64

            if [ -f "build/build.sh" ]; then
              # Use legacy build scripts for 5.x kernels
              LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang" || exit 1
              strings "out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist/Image" | grep 'Linux version'
            else
              # Use Bazel for kernels 6.1+
              # Move gki_defconfig changes to a fragment to avoid Bazel trim check failures
              FRAG="common/arch/arm64/configs/ksu.fragment"
              if [ ! -f "$FRAG" ]; then
                diff "$DEFCONFIG.orig" "$DEFCONFIG" | grep '^>' | sed 's/^> //; s/^[[:space:]]*//' > "$FRAG" || true
              fi
              cp "$DEFCONFIG.orig" "$DEFCONFIG"
              echo "=== KSU fragment content ==="
              cat "$FRAG"
              echo "========================="
              # Pass the fragment argument only when nonempty
              FRAG_FLAG=""
              if [ -s "$FRAG" ]; then
                FRAG_FLAG="--defconfig_fragment=//common:arch/arm64/configs/ksu.fragment"
              fi
              # Use lto=none on 6.12+ (Rust kernel modules are incompatible with thin LTO)
              LTO_FLAG="--lto=thin"
              if [ "${{ inputs.kernel_version }}" = "6.12" ] || [ "${{ inputs.kernel_version }}" = "6.18" ]; then
                LTO_FLAG="--lto=none"
              fi
              tools/bazel build --disk_cache=/home/runner/.cache/bazel --config=fast $LTO_FLAG $FRAG_FLAG //common:kernel_aarch64_dist || exit 1
              strings ./bazel-bin/common/kernel_aarch64/Image | grep 'Linux version'
            fi

            echo "Build complete: $BUILD_VARIANT"

      # ==================== Prepare kernel Image ====================
      # Copy build output to workspace for AnyKernel3 packaging
      - name: Prepare kernel Image
        id: prepare_kernel_image
        run: |
          if [ "${{ inputs.android_version }}" == "android12" ] || [ "${{ inputs.android_version }}" == "android13" ]; then
            SRC_DIR="$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist"
          else
            SRC_DIR="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
          fi

          cp "$SRC_DIR/Image" ./

      - name: Read compiled kernel configuration
        id: compiled_config
        continue-on-error: true
        shell: bash
        run: |
          if bash "$KERNEL_ROOT/common/scripts/extract-ikconfig" "$GITHUB_WORKSPACE/Image" > "$RUNNER_TEMP/cogan-compiled.config"; then
            echo "COMPILED_CONFIG=$RUNNER_TEMP/cogan-compiled.config" >> "$GITHUB_ENV"
          else
            echo "::warning::Image configuration unavailable; the summary will report integration step outcomes only."
          fi

      # ==================== Activate Bypass build ====================
      # Bypass only relaxes module version checks; standard Image remains the default artifact.
      - name: Activate Bypass kernel patch
        id: activate_bypass_kernel_patch
        if: inputs.build_bypass
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e

          if [ -f "common/kernel/module/version.c" ] && grep -q 'bad_version:' "common/kernel/module/version.c"; then
            TARGET_FILE="common/kernel/module/version.c"
          elif [ -f "common/kernel/module.c" ] && grep -q 'bad_version:' "common/kernel/module.c"; then
            TARGET_FILE="common/kernel/module.c"
          else
            echo "::error::Kernel module version-check file not found"
            exit 1
          fi

          # Match upstream behavior: change only the first return 0 in the bad_version block.
          sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"

          if ! sed -n '/bad_version:/,/return [01];/p' "$TARGET_FILE" | grep -q 'return 1;'; then
            echo "::error::Bypass patch failed: return 1 not found in bad_version"
            sed -n '/bad_version:/,/return [01];/p' "$TARGET_FILE" || true
            exit 1
          fi
          echo "Enabled Bypass module-version-check override: $TARGET_FILE"

      # ==================== Compile Bypass kernel ====================
      # Use the same build parameters as standard kernel so the two Images differ only in validation logic.
      - name: Build Bypass kernel
        id: build_bypass_kernel
        if: inputs.build_bypass
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: timeout
          command: |
            echo "Starting Bypass kernel build"
            set -ex
            cd "$KERNEL_ROOT"

            sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' ./common/build.config.gki.aarch64
            sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' ./common/build.config.gki.aarch64
            sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' ./common/build.config.gki.aarch64

            if [ -f "build/build.sh" ]; then
              # Use legacy build scripts for 5.x kernels
              LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang" || exit 1
              strings "out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist/Image" | grep 'Linux version'
            else
              # Use Bazel for kernels 6.1+
              FRAG="common/arch/arm64/configs/ksu.fragment"
              if [ ! -f "$FRAG" ]; then
                echo "::error::Standard build did not generate the KSU configuration fragment: $FRAG"
                exit 1
              fi
              cp "$DEFCONFIG.orig" "$DEFCONFIG"
              echo "=== Bypass KSU fragment content ==="
              cat "$FRAG"
              echo "================================"
              FRAG_FLAG=""
              if [ -s "$FRAG" ]; then
                FRAG_FLAG="--defconfig_fragment=//common:arch/arm64/configs/ksu.fragment"
              fi
              LTO_FLAG="--lto=thin"
              if [ "${{ inputs.kernel_version }}" = "6.12" ] || [ "${{ inputs.kernel_version }}" = "6.18" ]; then
                LTO_FLAG="--lto=none"
              fi
              tools/bazel build --disk_cache=/home/runner/.cache/bazel --config=fast $LTO_FLAG $FRAG_FLAG //common:kernel_aarch64_dist || exit 1
              strings ./bazel-bin/common/kernel_aarch64/Image | grep 'Linux version'
            fi

            echo "Bypass kernel build complete"

      # ==================== Prepare Bypass Image ====================
      - name: Prepare Bypass kernel Image
        id: prepare_bypass_kernel_image
        if: inputs.build_bypass
        run: |
          if [ "${{ inputs.android_version }}" == "android12" ] || [ "${{ inputs.android_version }}" == "android13" ]; then
            SRC_DIR="$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist"
          else
            SRC_DIR="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
          fi

          if [ ! -f "$SRC_DIR/Image" ]; then
            echo "::error::Bypass build artifact not found: $SRC_DIR/Image"
            exit 1
          fi
          cp "$SRC_DIR/Image" ./Bypass-Image

      # ==================== Create AnyKernel3 archive ====================
      - name: Create AnyKernel3 archive
        id: create_anykernel3_archive
        run: |
          cd $ANYKERNEL3
          ZIP_NAME="${CONFIG}-${BUILD_VARIANT}-AnyKernel3.zip"
          mv ../Image ./Image
          if [ "${{ inputs.build_bypass }}" = "true" ]; then
            if [ ! -f "../Bypass-Image" ]; then
              echo "::error::Bypass-Image not found; stopping packaging"
              exit 1
            fi
            mv ../Bypass-Image ./Bypass-Image
            patch -p1 --forward < "$GITHUB_WORKSPACE/.github/patches/bypass.patch"
          fi
          zip -r "../$ZIP_NAME" ./*

      # ==================== Build boot image (Android 12) ====================
      # Android 12 requires extracting ramdisk from certified GKI images
#      - name: Build boot image (Android 12)
#        if: inputs.android_version == 'android12'
#        working-directory: bootimgs
#        run: |
#          GKI_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-${{ inputs.os_patch_level }}_${{ inputs.revision }}.zip
#          FALLBACK_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2023-01_r1.zip
#
#          status=$(curl -sL -w "%{http_code}" "$GKI_URL" -o /dev/null)
#          if [ "$status" = "200" ]; then
#            curl -Lo gki-kernel.zip "$GKI_URL"
#          else
#            curl -Lo gki-kernel.zip "$FALLBACK_URL"
#          fi
#
#          unzip gki-kernel.zip && rm gki-kernel.zip
#          $UNPACK_BOOTIMG --boot_img="$(pwd)/boot-5.10.img"
#
#          gzip -n -k -f -9 ./Image > ./Image.gz
#
#         # Create standard boot.img
#          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
#          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
#          cp ./boot.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot.img
#
#          # Create gzip-compressed boot.img
#          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
#          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
#          cp ./boot-gz.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-gz.img
#
#          # Create lz4-compressed boot.img
#          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
#          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
#          cp ./boot-lz4.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-lz4.img
#
#      # ==================== Build boot image (Android 13+) ====================
#      # Android 13 and newer do not need ramdisk
#      - name: Build boot image (Android 13+)
#        if: inputs.android_version == 'android13' || inputs.android_version == 'android14' || inputs.android_version == 'android15' || inputs.android_version == 'android16'
#        working-directory: bootimgs
#        run: |
#          gzip -n -k -f -9 ./Image > ./Image.gz
#
#          # Create standard boot.img
#          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img
#          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
#          cp ./boot.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot.img
#
#          # Create gzip-compressed boot.img
#          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img
#          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
#          cp ./boot-gz.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-gz.img
#
#          # Create lz4-compressed boot.img
#          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img
#          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
#          cp ./boot-lz4.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-lz4.img
#
      # ==================== Collect rejected patch files ====================
      # Collect all .rej files for debugging patch failures
      - name: Collect rejected patch files
        id: collect_rejected_patch_files
        if: always()
        run: |
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"

          mapfile -t REJS < <(find "$KERNEL_ROOT" -type f -name '*.rej')
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej files"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV

          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#"$KERNEL_ROOT"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"

              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                cp "$ORIG" "${DEST%.rej}"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      # ==================== Upload original flashable ZIP ====================
      # upload-artifact@v7 archive:false delivers the original ZIP without wrapping it.
      - name: Upload ready-to-flash ZIP
        id: upload_ready_to_flash_zip
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.CONFIG }}-${{ env.BUILD_VARIANT }}-AnyKernel3.zip
          if-no-files-found: error
          archive: false

      # ==================== Upload rejected patch files ====================
      - name: Upload rejected patch files
        id: upload_rejected_patch_files
        if: always() && env.REJ_COUNT > 0
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BUILD_VARIANT }}_kernel-${{ env.CONFIG }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      # Always report actual outcomes, even if source checkout or compilation failed.
      - name: Build result summary
        if: always()
        shell: bash
        env:
          REPORT_INPUTS: ${{ toJSON(inputs) }}
          REPORT_STEPS: ${{ toJSON(steps) }}
          REPORT_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY_REPORT'
          import os
          import io

          # UI text is translated before interpolation; user inputs and commit IDs remain unchanged.
          TRANSLATIONS = {'## Build information': ['## Informasi build', '## 构建信息'],
           '## Features': ['## Fitur', '## 功能'],
